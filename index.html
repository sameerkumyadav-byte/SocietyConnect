    const TH = {

    /* ══════════════════════════════════════
       API LAYER
    ══════════════════════════════════════ */
    const API = {
      base: () => localStorage.getItem("sc_url") || "https://societyconnect-knct.onrender.com",
      token: () => localStorage.getItem("sc_token"),
      headers() {
        const h = { "Content-Type": "application/json" };
        const t = this.token();
        if (t) h["Authorization"] = `Bearer ${t}`;
        return h;
      },
      async call(path, opts = {}) {
        try {
          const r = await fetch(this.base() + path, { ...opts, headers: { ...this.headers(), ...(opts.headers || {}) } });
          const d = await r.json();
          if (r.status === 401) {
            // Stale/invalid token — clear it so re-login works fresh
            localStorage.removeItem("sc_token");
            throw new Error(d.error || "Session expired. Please sign in again.");
          }
          if (!r.ok) throw new Error(d.error || d.message || `Server error (${r.status})`);
          return d;
        } catch (e) {
          if (e.message === "Failed to fetch" || e.name === "TypeError") {
            throw new Error("Cannot reach server. Check your connection.");
          }
          throw e;
        }
      },
      login: (e, p) => API.call("/api/auth/login", { method: "POST", body: JSON.stringify({ email: e, password: p }) }),
      loginVerifyOtp: (userId, otp) => API.call("/api/auth/login/verify-otp", { method: "POST", body: JSON.stringify({ user_id: userId, otp }) }),
      signup: (d) => API.call("/api/auth/signup", { method: "POST", body: JSON.stringify(d) }),
      signupSendOtp: (d) => API.call("/api/auth/signup/send-otp", { method: "POST", body: JSON.stringify(d) }),
      signupVerifyOtp: (sessionKey, otp) => API.call("/api/auth/signup/verify-otp", { method: "POST", body: JSON.stringify({ session_key: sessionKey, otp }) }),
      forgotPw: (e) => API.call("/api/auth/forgot-password", { method: "POST", body: JSON.stringify({ email: e }) }),
      forgotVerifyOtp: (userId, otp, newPw) => API.call("/api/auth/forgot-password/verify-otp", { method: "POST", body: JSON.stringify({ user_id: userId, otp, new_password: newPw }) }),
      getMe: () => API.call("/api/users/me"),
      updateMe: (d) => API.call("/api/users/me", { method: "PUT", body: JSON.stringify(d) }),
      deleteMe: () => API.call("/api/users/me", { method: "DELETE" }),
      switchRole: (d) => API.call("/api/users/me/switch-role", { method: "POST", body: JSON.stringify(d) }),
      updateProvider: (d) => API.call("/api/providers/me", { method: "PUT", body: JSON.stringify(d) }),
      getRequests: () => API.call("/api/requests"),
      createRequest: (d) => API.call("/api/requests", { method: "POST", body: JSON.stringify(d) }),
      updateRequest: (id, d) => API.call(`/api/requests/${id}`, { method: "PUT", body: JSON.stringify(d) }),

    async function ai(prompt, sys = "") {
      try {
        const r = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 800, system: sys, messages: [{ role: "user", content: prompt }] })
        });
        const d = await r.json();
        return d.content?.[0]?.text || "AI unavailable.";
      } catch { return "AI service unavailable."; }
    }

    function Av({ s = "?", sz = 36, col = "#8B83A8" }) { return <div style={{ width: sz, height: sz, borderRadius: "50%", background: col + "22", border: `1.5px solid ${col}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: sz * 0.35, fontWeight: 700, color: col, flexShrink: 0 }}>{(s || "?")[0]?.toUpperCase()}</div>; }
    function Badge({ s }) { const c = ST_COL[s] || { bg: "rgba(100,100,100,0.12)", c: "#9ca3af" }; return <span style={{ background: c.bg, color: c.c, fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 20, whiteSpace: "nowrap" }}>{s}</span>; }
    function Card({ children, t, style = {}, onClick }) { return <div onClick={onClick} style={{ background: t.card, border: `1px solid ${t.border}`, borderRadius: 14, padding: 16, ...style, cursor: onClick ? "pointer" : undefined }}>{children}</div>; }
    function Btn({ children, onClick, v = "pri", sz = "md", style = {}, disabled = false, full = false, t = {} }) {
      const szM = { sm: { padding: "6px 14px", fontSize: 12 }, md: { padding: "10px 20px", fontSize: 14 }, lg: { padding: "13px 28px", fontSize: 15 } };
      const acc = t.accent || "#8B5CF6";
      const accH = t.accentHov || "#7C3AED";
      // Each variant is self-contained: solid bg, legible text, visible border
      const vM = {
        pri: { background: acc, color: "#ffffff", fontWeight: 700, border: "none", boxShadow: `0 1px 3px rgba(0,0,0,0.3)` },
        ghost: { background: "transparent", color: t.muted || "#8888A0", border: `1px solid ${t.border || "#2A2A3C"}`, fontWeight: 500 },
        ok: { background: "rgba(16,185,129,0.15)", color: t.success || "#10B981", border: `1px solid rgba(16,185,129,0.35)`, fontWeight: 600 },
        bad: { background: "rgba(239,68,68,0.15)", color: t.error || "#F87171", border: `1px solid rgba(239,68,68,0.35)`, fontWeight: 600 },
        info: { background: t.card2 || "#1E1E2E", color: t.muted || "#8888A0", border: `1px solid ${t.border || "#2A2A3C"}`, fontWeight: 600 },
        danger: { background: "#DC2626", color: "#fff", fontWeight: 700, border: "none" },
      };
      return <button onClick={onClick} disabled={disabled} style={{ ...szM[sz], ...vM[v || "pri"], borderRadius: 10, transition: "all 0.15s", lineHeight: 1, ...(full ? { width: "100%" } : {}), ...style }}>{children}</button>;
    }

    /* ══════════════════════════════════════

    function Toast({ toasts, remove }) {
      return (
        <div style={{ position: "fixed", bottom: 60, left: "50%", transform: "translateX(-50%)", zIndex: 99999, display: "flex", flexDirection: "column", gap: 8, alignItems: "center", pointerEvents: "none", minWidth: 260, maxWidth: 380 }}>
          {toasts.map(t2 => (
            <div key={t2.id} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "11px 16px", borderRadius: 12,
              background: t2.type === "error" ? "rgba(17,24,39,0.97)" : "rgba(17,24,39,0.97)",
              border: `1px solid ${t2.type === "error" ? "rgba(248,113,113,0.4)" : "rgba(16,185,129,0.4)"}`,
              color: t2.type === "error" ? "#F87171" : "#6ee7b7",
              fontSize: 13, fontWeight: 600, boxShadow: "0 8px 32px rgba(0,0,0,0.5)",
              backdropFilter: "blur(12px)", pointerEvents: "all",
              animation: "fadeIn 0.2s ease", whiteSpace: "pre-line", textAlign: "center"
            }}>
              <span style={{ fontSize: 16, flexShrink: 0 }}>{t2.type === "error" ? "❌" : "✅"}</span>
              <span>{t2.msg}</span>
            </div>
          ))}
        </div>
      );
    }

    function useToast() {
      const [toasts, setToasts] = useState([]);
      const show = (msg, type = "error") => {
        const id = Date.now() + Math.random();
        setToasts(p => [...p, { id, msg, type }]);
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3200);
      };
      const err = (msg) => show(msg, "error");
      const ok = (msg) => show(msg, "ok");
      return { toasts, err, ok, show };
    }

    /* ══════════════════════════════════════
       FORGOT PASSWORD MODAL
    ══════════════════════════════════════ */
    function ForgotPasswordModal({ onClose }) {
      const [step, setStep] = useState(1);
      const [email, setEmail] = useState("");
      const [userId, setUserId] = useState(null);
      const [otp, setOtp] = useState("");
      const [newPw, setNewPw] = useState("");
      const [showPw, setShowPw] = useState(false);
      const [msg, setMsg] = useState("");
      const [err, setErr] = useState("");
      const [load, setLoad] = useState(false);
      const [devOtp, setDevOtp] = useState("");
      const [resend, setResend] = useState(0);
      const startResend = () => { setResend(30); const iv = setInterval(() => setResend(p => { if (p <= 1) { clearInterval(iv); return 0; } return p - 1; }), 1000); };

      const sendEmailOtp = async (toEmail, otpCode) => {
        const svcId = window.EMAILJS_SERVICE_ID;
        const tplId = window.EMAILJS_TEMPLATE_ID;
        const pubKey = window.EMAILJS_PUBLIC_KEY;
        const configured = svcId && svcId !== "YOUR_SERVICE_ID" && tplId !== "YOUR_TEMPLATE_ID" && pubKey !== "YOUR_PUBLIC_KEY";
        if (configured) {
          try {
            await emailjs.send(svcId, tplId, { to_email: toEmail, to_name: toEmail.split("@")[0], otp_code: otpCode, app_name: "SocietyConnect" }, pubKey);
            return true;
          } catch (ejsErr) { console.warn("EmailJS error:", ejsErr); return false; }
        }
        return false;
      };

      const requestOtp = async () => {
        if (!email) { setErr("Enter your email address."); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setErr("Enter a valid email address."); return; }
        setLoad(true); setErr(""); setMsg("");
        try {
          const r = await API.forgotPw(email);
          setUserId(r.user_id);
          if (r.otp) {
            const sent = await sendEmailOtp(email, r.otp);
            if (sent) { setMsg("OTP sent to your email! Check your inbox."); setDevOtp(""); }
            else { setDevOtp(r.otp); setMsg("Email not configured — use the OTP shown below."); }
          }
          setStep(2); startResend();
        } catch (e) { setErr(e.message); }
        setLoad(false);
      };

      const doResend = async () => {
        setErr(""); setOtp("");
        try {
          const r = await API.forgotPw(email);
          setUserId(r.user_id);
          if (r.otp) {
            const sent = await sendEmailOtp(email, r.otp);
            if (sent) { setMsg("New OTP sent!"); setDevOtp(""); }
            else { setDevOtp(r.otp); setMsg("OTP regenerated."); }
          }
          startResend();
        } catch (e) { setErr(e.message); }
      };

      const doReset = async () => {
        const cleanOtp = otp.replace(/ /g, "");
        if (cleanOtp.length < 6) { setErr("Enter the complete 6-digit OTP."); return; }
        if (!newPw || newPw.length < 6) { setErr("Password must be at least 6 characters."); return; }
        setLoad(true); setErr("");
        try {
          await API.forgotVerifyOtp(userId, cleanOtp, newPw);
          setMsg("✅ Password reset successfully!");
          setTimeout(onClose, 2000);
        } catch (e) { setErr(e.message); }
        setLoad(false);
      };

      const OtpRow = () => (
        <div style={{ display: "flex", gap: 8, justifyContent: "center", margin: "20px 0" }}>
          {[0,1,2,3,4,5].map(i => (
            <input key={i} id={`fotp${i}`} type="text" inputMode="numeric" maxLength={1} value={otp[i] || ""}
              onChange={e => {
                const v = e.target.value.replace(/\D/g,"").slice(-1);
                const arr = (otp+"      ").slice(0,6).split(""); arr[i]=v;
                const j = arr.join("").slice(0,6); setOtp(j);
                if (v && i<5) setTimeout(()=>document.getElementById(`fotp${i+1}`)?.focus(),0);
              }}
              onKeyDown={e => {
                if (/^[0-9]$/.test(e.key)) { e.preventDefault(); const arr=(otp+"      ").slice(0,6).split(""); arr[i]=e.key; const j=arr.join("").slice(0,6); setOtp(j); if(i<5) setTimeout(()=>document.getElementById(`fotp${i+1}`)?.focus(),0); }
                if (e.key==="Backspace") { e.preventDefault(); const arr=(otp+"      ").slice(0,6).split(""); if(otp[i]?.trim()){arr[i]=" ";setOtp(arr.join("").slice(0,6));if(i>0)setTimeout(()=>document.getElementById(`fotp${i-1}`)?.focus(),0);}else if(i>0){arr[i-1]=" ";setOtp(arr.join("").slice(0,6));setTimeout(()=>document.getElementById(`fotp${i-1}`)?.focus(),0);} }
                if (e.key==="ArrowLeft"&&i>0) document.getElementById(`fotp${i-1}`)?.focus();
                if (e.key==="ArrowRight"&&i<5) document.getElementById(`fotp${i+1}`)?.focus();
              }}
              onPaste={e => { e.preventDefault(); const p=e.clipboardData.getData("text").replace(/\D/g,"").slice(0,6); if(p){setOtp(p);setTimeout(()=>document.getElementById(`fotp${Math.min(p.length,5)}`)?.focus(),10);} }}
              onFocus={e => e.target.select()}
              style={{ width: 44, height: 52, textAlign: "center", fontSize: 20, fontWeight: 700, borderRadius: 12, border: `2px solid ${otp[i]?.trim() ? "#7C3AED" : "#E2E8F0"}`, background: otp[i]?.trim() ? "#F5F3FF" : "#F8FAFC", color: otp[i]?.trim() ? "#7C3AED" : "#475569", fontFamily: "monospace", outline: "none", transition: "all 0.15s" }} />
          ))}
        </div>
      );

      return (
        <div className="modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "#fff", borderRadius: 24, padding: 0, width: "100%", maxWidth: 420, overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06)" }}>

            {/* Header stripe */}
            <div style={{ background: "linear-gradient(135deg,#7C3AED,#8B5CF6)", padding: "28px 28px 24px", textAlign: "center" }}>
              <div style={{ width: 56, height: 56, borderRadius: 16, background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, margin: "0 auto 12px" }}>
                {step === 1 ? "🔑" : step === 2 ? "📨" : "✅"}
              </div>
              <h3 style={{ color: "#fff", fontFamily: "'Playfair Display',serif", fontSize: 21, margin: "0 0 6px", fontWeight: 700 }}>
                {step === 1 ? "Forgot Password?" : step === 2 ? "Check Your Email" : "Password Reset!"}
              </h3>
              <p style={{ color: "rgba(255,255,255,0.8)", fontSize: 13, margin: 0 }}>
                {step === 1 ? "Enter your email to receive a reset OTP" : step === 2 ? `OTP sent to ${email}` : "You can now sign in with your new password"}
              </p>
              <button onClick={onClose} style={{ position: "absolute", top: 14, right: 14, background: "rgba(255,255,255,0.2)", border: "none", color: "#fff", width: 30, height: 30, borderRadius: "50%", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1 }}>×</button>
            </div>

            <div style={{ padding: 28 }}>
              {/* Step indicators */}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 22 }}>
                {[1,2].map((s,i) => (
                  <React.Fragment key={s}>
                    <div style={{ width: 28, height: 28, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, background: step > s ? "#7C3AED" : step === s ? "#7C3AED" : "#F1F5F9", color: step >= s ? "#fff" : "#94A3B8", transition: "all 0.3s" }}>
                      {step > s ? "✓" : s}
                    </div>
                    {i < 1 && <div style={{ width: 40, height: 2, background: step > 1 ? "#7C3AED" : "#E2E8F0", borderRadius: 2, transition: "background 0.3s" }} />}
                  </React.Fragment>
                ))}
              </div>

              {/* Error / success messages */}
              {err && <div style={{ padding: "10px 14px", background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 10, fontSize: 13, color: "#DC2626", marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>⚠️ {err}</div>}
              {msg && <div style={{ padding: "10px 14px", background: "#F0FDF4", border: "1px solid #BBF7D0", borderRadius: 10, fontSize: 13, color: "#16A34A", marginBottom: 14, display: "flex", alignItems: "center", gap: 8 }}>✅ {msg}</div>}

              {/* Dev OTP hint */}
              {devOtp && <div style={{ padding: "10px 14px", background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 10, fontSize: 13, color: "#92400E", marginBottom: 14, textAlign: "center" }}>
                ⚠️ Email not configured — OTP: <b style={{ letterSpacing: 3, fontSize: 17, color: "#7C3AED" }}>{devOtp}</b>
              </div>}

              {/* STEP 1 */}
              {step === 1 && <>
                <label style={{ fontSize: 11, fontWeight: 700, color: "#64748B", letterSpacing: "1px", textTransform: "uppercase", display: "block", marginBottom: 6 }}>Email Address</label>
                <input value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" type="email" onKeyDown={e => e.key === "Enter" && requestOtp()}
                  style={{ width: "100%", padding: "12px 14px", borderRadius: 12, border: "1.5px solid #E2E8F0", background: "#F8FAFC", color: "#1A1F36", fontSize: 14, boxSizing: "border-box", outline: "none", fontFamily: "inherit", marginBottom: 16, transition: "border-color 0.15s" }}
                  onFocus={e => e.target.style.borderColor = "#7C3AED"} onBlur={e => e.target.style.borderColor = "#E2E8F0"} />
                <button onClick={requestOtp} disabled={load}
                  style={{ width: "100%", padding: "13px", borderRadius: 12, border: "none", background: load ? "#C4B5FD" : "linear-gradient(135deg,#7C3AED,#8B5CF6)", color: "#fff", fontSize: 14, fontWeight: 700, cursor: load ? "not-allowed" : "pointer", transition: "all 0.2s" }}>
                  {load ? "Sending OTP…" : "Send OTP →"}
                </button>
                <button onClick={onClose} style={{ width: "100%", marginTop: 10, padding: "11px", borderRadius: 12, border: "1.5px solid #E2E8F0", background: "transparent", color: "#64748B", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                  ← Back to Sign In
                </button>
              </>}

              {/* STEP 2 */}
              {step === 2 && <>
                <p style={{ fontSize: 13, color: "#64748B", margin: "0 0 4px", textAlign: "center" }}>Enter the 6-digit code sent to your email</p>
                <OtpRow />
                <label style={{ fontSize: 11, fontWeight: 700, color: "#64748B", letterSpacing: "1px", textTransform: "uppercase", display: "block", marginBottom: 6 }}>New Password</label>
                <div style={{ position: "relative", marginBottom: 18 }}>
                  <input type={showPw ? "text" : "password"} value={newPw} onChange={e => setNewPw(e.target.value)} placeholder="Minimum 6 characters"
                    style={{ width: "100%", padding: "12px 44px 12px 14px", borderRadius: 12, border: "1.5px solid #E2E8F0", background: "#F8FAFC", color: "#1A1F36", fontSize: 14, boxSizing: "border-box", outline: "none", fontFamily: "inherit", transition: "border-color 0.15s" }}
                    onFocus={e => e.target.style.borderColor = "#7C3AED"} onBlur={e => e.target.style.borderColor = "#E2E8F0"} />
                  <button onClick={() => setShowPw(p => !p)} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer", fontSize: 16, color: "#94A3B8" }}>{showPw ? "🙈" : "👁️"}</button>
                </div>
                <button onClick={doReset} disabled={load || otp.replace(/ /g,"").length < 6 || !newPw}
                  style={{ width: "100%", padding: "13px", borderRadius: 12, border: "none", background: (load || otp.replace(/ /g,"").length < 6 || !newPw) ? "#E2E8F0" : "linear-gradient(135deg,#7C3AED,#8B5CF6)", color: (load || otp.replace(/ /g,"").length < 6 || !newPw) ? "#94A3B8" : "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 10, transition: "all 0.2s" }}>
                  {load ? "Resetting…" : "Reset Password ✓"}
                </button>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <button onClick={() => { setStep(1); setOtp(""); setDevOtp(""); setErr(""); setMsg(""); }} style={{ background: "none", border: "none", color: "#64748B", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>← Back</button>
                  <button onClick={doResend} disabled={resend > 0} style={{ background: "none", border: "none", color: resend > 0 ? "#94A3B8" : "#7C3AED", fontSize: 12, fontWeight: 700, cursor: resend > 0 ? "not-allowed" : "pointer" }}>
                    {resend > 0 ? `Resend in ${resend}s` : "↻ Resend OTP"}
                  </button>
                </div>
              </>}
            </div>
          </div>
        </div>
      );
    }

    function Auth({ onLogin, onBack }) {
      const [mode, setMode] = useState("login");
      const [showForgot, setShowForgot] = useState(false);
      const [flipping, setFlipping] = useState(false);
      // OTP login state
      const [otpStep, setOtpStep] = useState(false);
      const [pendingUserId, setPendingUserId] = useState(null);
      const [loginOtp, setLoginOtp] = useState("");
      const [devOtp, setDevOtp] = useState("");
      // OTP signup state
      const [signupOtpStep, setSignupOtpStep] = useState(false);
      const [signupSessionKey, setSignupSessionKey] = useState(null);
      const [resendCooldown, setResendCooldown] = useState(0);
      const startCooldown = () => { setResendCooldown(30); const t = setInterval(() => setResendCooldown(p => { if (p <= 1) { clearInterval(t); return 0; } return p - 1; }), 1000); };
      const [signupOtp, setSignupOtp] = useState("");
      const [signupDevOtp, setSignupDevOtp] = useState("");
      const [f, setF] = useState({ name: "", email: "", pass: "", phone: "", role: "customer", skill: "", society: "Shapoorji Complex, New Town", exp: "" });
      const sv = (k, v) => setF(p => ({ ...p, [k]: v }));
      const [err, setErr] = useState("");
      const [load, setLoad] = useState(false);

      const switchMode = (newMode) => {
        if (newMode === mode || flipping) return;
        setFlipping(true);
        setTimeout(() => { setMode(newMode); setErr(""); }, 280);
        setTimeout(() => setFlipping(false), 560);
      };
      const t = { bg: "#F8FAFC", card: "#ffffff", card2: "#F1F5F9", border: "#E2E8F0", inp: "#F8FAFC", txt: "#1A1F36", muted: "#64748B", accent: "#7C3AED", accentHov: "#6D28D9", success: "#10B981", error: "#DC2626", warn: "#D97706" };
      const IS = {
        width: "100%", padding: "12px 16px", borderRadius: 12,
        border: "1.5px solid #E2E8F0",
        background: "#F8FAFC",
        color: "#1A1F36", fontSize: 14, boxSizing: "border-box", fontFamily: "inherit",
        transition: "border-color 0.2s, box-shadow 0.2s",
        outline: "none",
      };

      const validate = () => {
        if (mode === "login") {
          if (!f.email) return "Email is required.";
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) return "Enter a valid email address.";
          if (!f.pass) return "Password is required.";
          return null;
        }
        if (!f.name.trim()) return "Full name is required.";
        if (!f.email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) return "Enter a valid email address.";
        if (!f.pass || f.pass.length < 6) return "Password must be at least 6 characters.";
        if (!f.phone || f.phone.replace(/\D/g, "").length < 10) return "Enter a valid 10-digit phone number.";
        if (f.role === "provider" && !f.skill) return "Please select your skill.";
        if (!f.society) return "Please select your society.";
        return null;
      };

      const submit = async () => {
        const e = validate();
        if (e) { setErr(e); return; }
        setLoad(true); setErr("");
        // Clear any stale token before attempting login
        if (mode === "login") localStorage.removeItem("sc_token");
        try {
          if (mode === "login") {
            const r = await API.login(f.email.trim().toLowerCase(), f.pass);
            if (r.otp_required) {
              setPendingUserId(r.user_id);
              if (r.otp) {
                const svcId = window.EMAILJS_SERVICE_ID;
                const tplId = window.EMAILJS_TEMPLATE_ID;
                const pubKey = window.EMAILJS_PUBLIC_KEY;
                const ejsConfigured = svcId !== "YOUR_SERVICE_ID" && tplId !== "YOUR_TEMPLATE_ID" && pubKey !== "YOUR_PUBLIC_KEY";
                if (ejsConfigured) {
                  try {
                    await emailjs.send(svcId, tplId, { to_email: f.email, to_name: f.email.split("@")[0], otp_code: r.otp, app_name: "SocietyConnect" }, pubKey);
                  } catch (ejsErr) {
                    console.warn("EmailJS failed:", ejsErr);
                    setDevOtp(r.otp);
                  }
                } else {
                  setDevOtp(r.otp);
                }
              }
              setOtpStep(true);
            } else {
              localStorage.setItem("sc_token", r.token);
              onLogin(r.user);
            }
          } else {
            const generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
            const svcId = window.EMAILJS_SERVICE_ID;
            const tplId = window.EMAILJS_TEMPLATE_ID;
            const pubKey = window.EMAILJS_PUBLIC_KEY;
            const ejsConfigured = svcId !== "YOUR_SERVICE_ID" && tplId !== "YOUR_TEMPLATE_ID" && pubKey !== "YOUR_PUBLIC_KEY";
            if (ejsConfigured) {
              try {
                await emailjs.send(svcId, tplId, { to_email: f.email, to_name: f.name, otp_code: generatedOtp, app_name: "SocietyConnect" }, pubKey);
                setSignupDevOtp("");
              } catch (ejsErr) {
                console.warn("EmailJS send failed:", ejsErr);
                setSignupDevOtp(generatedOtp);
              }
            } else {
              setSignupDevOtp(generatedOtp);
            }
            setSignupSessionKey(generatedOtp);
            setSignupOtpStep(true);
          }
        } catch (e) { setErr(e.message); }
        setLoad(false);
      };

      const OtpBoxes = ({ otp, setOtp, prefix, onComplete }) => {
        const handlePaste = (e) => {
          e.preventDefault();
          const pasted = e.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
          if (pasted.length > 0) {
            setOtp(pasted);
            const nextIdx = Math.min(pasted.length, 5);
            setTimeout(() => document.getElementById(`${prefix}${nextIdx}`)?.focus(), 10);
            if (pasted.length === 6 && onComplete) onComplete(pasted);
          }
        };
        const set = (idx, val) => {
          const arr = (otp + "      ").slice(0, 6).split("");
          arr[idx] = val;
          const joined = arr.join("").slice(0, 6);
          setOtp(joined);
          return joined;
        };
        return (
          <div style={{ display: "flex", gap: 10, justifyContent: "center", margin: "20px 0" }}>
            {[0, 1, 2, 3, 4, 5].map(i => (
              <input key={i} id={`${prefix}${i}`} type="text" inputMode="numeric" maxLength={1} value={otp[i] || ""}
                onChange={e => {
                  const v = e.target.value.replace(/\D/g, "").slice(-1);
                  const joined = set(i, v);
                  if (v && i < 5) setTimeout(() => document.getElementById(`${prefix}${i + 1}`)?.focus(), 0);
                  const clean = joined.replace(/ /g, "");
                  if (clean.length === 6 && onComplete) onComplete(clean);
                }}
                onKeyDown={e => {
                  if (/^[0-9]$/.test(e.key)) {
                    e.preventDefault();
                    const joined = set(i, e.key);
                    if (i < 5) setTimeout(() => document.getElementById(`${prefix}${i + 1}`)?.focus(), 0);
                    const clean = joined.replace(/ /g, "");
                    if (clean.length === 6 && onComplete) onComplete(clean);
                  }
                  if (e.key === "Backspace") {
                    e.preventDefault();
                    if (otp[i]) { set(i, " "); }
                    else if (i > 0) { set(i - 1, " "); setTimeout(() => document.getElementById(`${prefix}${i - 1}`)?.focus(), 0); }
                  }
                  if (e.key === "ArrowLeft" && i > 0) document.getElementById(`${prefix}${i - 1}`)?.focus();
                  if (e.key === "ArrowRight" && i < 5) document.getElementById(`${prefix}${i + 1}`)?.focus();
                }}
                onPaste={handlePaste}
                onFocus={e => e.target.select()}
                style={{
                  width: 46, height: 56, textAlign: "center", fontSize: 22, fontWeight: 700,
                  borderRadius: 12,
                  border: `2px solid ${otp[i] && otp[i].trim() ? "#7C3AED" : "#E2E8F0"}`,
                  background: otp[i] && otp[i].trim() ? "#F5F3FF" : "#F8FAFC",
                  color: otp[i] && otp[i].trim() ? "#7C3AED" : "#94A3B8",
                  fontFamily: "monospace", transition: "all 0.15s", outline: "none",
                }} />
            ))}
          </div>
        );
      };

      // Auth page wrapper styles — LIGHT MODE
      const authS = {
        page: {
          minHeight: "100vh", display: "flex",
          background: "linear-gradient(135deg,#F5F3FF 0%,#EFF6FF 50%,#F0FDF4 100%)",

        @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
        @keyframes scrollRevealUp{from{opacity:0;transform:translateY(22px) scale(0.97);}to{opacity:1;transform:none;}}

        @keyframes scrollRevealRight{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:none;}}

              {onBack && <button onClick={onBack} style={{ position: "absolute", top: -14, right: -14, zIndex: 10, width: 36, height: 36, borderRadius: "50%", background: "#fff", border: "1px solid #E2E8F0", color: "#64748B", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 2px 8px rgba(0,0,0,0.08)", transition: "all 0.2s", lineHeight: 1 }} title="Close">×</button>}

              {/* Logo */}
              <div style={{ textAlign: "center", marginBottom: 28, animation: "fadeUp 0.5s 0.1s both ease" }}>
                <div style={{ display: "inline-flex", width: 60, height: 60, borderRadius: 18, background: "linear-gradient(135deg,#7C3AED,#8B5CF6)", alignItems: "center", justifyContent: "center", fontSize: 26, marginBottom: 14, boxShadow: "0 8px 24px rgba(124,58,237,0.3)" }}>🏙️</div>
                <h1 style={{ fontFamily: "'Playfair Display',serif", fontSize: 26, color: "#1A1F36", margin: "0 0 6px", letterSpacing: "-0.5px" }}>SocietyConnect</h1>
                <p style={{ color: "#64748B", fontSize: 13 }}>Your community, connected &amp; smarter</p>
              </div>

              <div style={{ ...authS.card, transform: flipping ? "rotateY(90deg) scale(0.96)" : "rotateY(0deg) scale(1)", opacity: flipping ? 0 : 1, willChange: "transform,opacity" }}>

                {/* ── LOGIN OTP STEP ── */}
                {otpStep && <div className="fade-in">
                  <div style={{ textAlign: "center", marginBottom: 20 }}>
                    <div style={{ fontSize: 40, marginBottom: 10 }}>📧</div>
                    <h3 style={{ fontFamily: "'Playfair Display',serif", fontSize: 21, color: "#1A1F36", margin: "0 0 8px" }}>Verify Identity</h3>
                    <p style={{ fontSize: 13, color: "#64748B", lineHeight: 1.6 }}>6-digit OTP sent to<br /><b style={{ color: "#7C3AED" }}>{f.email}</b></p>
                  </div>
                  {devOtp && <div style={authS.devBox}>⚠️ Dev mode — OTP: <b style={{ letterSpacing: 3, fontSize: 18, color: "#7C3AED" }}>{devOtp}</b></div>}
                  {err && <div style={authS.errBox}>{err}</div>}
                  <OtpBoxes otp={loginOtp} setOtp={setLoginOtp} prefix="lotp" onComplete={joined => {
                    setLoad(true); setErr("");
                    API.loginVerifyOtp(pendingUserId, joined).then(r => { localStorage.setItem("sc_token", r.token); onLogin(r.user); }).catch(e => { setErr(e.message); setLoad(false); });
                  }} />
                  <button className="auth-btn-pri" onClick={async () => { setLoad(true); setErr(""); try { const r = await API.loginVerifyOtp(pendingUserId, loginOtp); localStorage.setItem("sc_token", r.token); onLogin(r.user); } catch (e) { setErr(e.message); } setLoad(false); }} disabled={load || loginOtp.length < 6} style={{ ...authS.submitBtn, opacity: (load || loginOtp.length < 6) ? 0.5 : 1 }}>{load ? "Verifying…" : "Confirm OTP →"}</button>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginTop: 10 }}>
                    <button onClick={() => { setOtpStep(false); setLoginOtp(""); setDevOtp(""); setErr(""); }} style={{ background: "none", border: "none", color: "#64748B", fontSize: 12, cursor: "pointer", padding: "8px" }}>← Back</button>
                    <span style={{ color: "#E2E8F0", fontSize: 12 }}>|</span>
                    <button disabled={resendCooldown > 0} onClick={async () => { setErr(""); setLoginOtp(""); try { const r = await API.loginRequestOtp(f.email); setPendingUserId(r.user_id); const ejsConfigured = window.EMAILJS_SERVICE_ID !== "YOUR_SERVICE_ID"; if (ejsConfigured) { try { await emailjs.send(window.EMAILJS_SERVICE_ID, window.EMAILJS_TEMPLATE_ID, { to_email: f.email, to_name: f.email.split("@")[0], otp_code: r.otp, app_name: "SocietyConnect" }, window.EMAILJS_PUBLIC_KEY); setDevOtp(""); } catch { setDevOtp(r.otp); } } else { setDevOtp(r.otp); } startCooldown(); } catch(e) { setErr(e.message); } }} style={{ background: "none", border: "none", color: resendCooldown > 0 ? "#94A3B8" : "#7C3AED", fontSize: 12, cursor: resendCooldown > 0 ? "not-allowed" : "pointer", padding: "8px", fontWeight: 700 }}>{resendCooldown > 0 ? `Resend in ${resendCooldown}s` : "↻ Resend OTP"}</button>
                  </div>
                </div>}

                {/* ── SIGNUP OTP STEP ── */}
                {signupOtpStep && <div className="fade-in">
                  <div style={{ textAlign: "center", marginBottom: 20 }}>
                    <div style={{ fontSize: 40, marginBottom: 10 }}>✉️</div>
                    <h3 style={{ fontFamily: "'Playfair Display',serif", fontSize: 21, color: "#1A1F36", margin: "0 0 8px" }}>Verify Your Email</h3>
                    <p style={{ fontSize: 13, color: "#64748B", lineHeight: 1.6 }}>OTP sent to<br /><b style={{ color: "#7C3AED" }}>{f.email}</b></p>
                  </div>
                  {signupDevOtp && <div style={authS.devBox}>⚠️ Dev mode — OTP: <b style={{ letterSpacing: 3, fontSize: 18, color: "#7C3AED" }}>{signupDevOtp}</b></div>}
                  {err && <div style={authS.errBox}>{err}</div>}
                  <OtpBoxes otp={signupOtp} setOtp={setSignupOtp} prefix="sotp" onComplete={joined => {
                    if (joined !== signupSessionKey) { setErr("Incorrect OTP. Please try again."); return; }
                    setLoad(true); setErr("");
                    API.signup({ name: f.name, email: f.email, password: f.pass, phone: f.phone.replace(/\D/g, ""), role: f.role, skill: f.role === "provider" ? f.skill : "", society: f.society, experience: f.exp || "" }).then(r => { localStorage.setItem("sc_token", r.token); onLogin(r.user); }).catch(e => { setErr(e.message); setLoad(false); });
                  }} />
                  <button className="auth-btn-pri" onClick={async () => { if (signupOtp !== signupSessionKey) { setErr("Incorrect OTP."); return; } setLoad(true); setErr(""); try { const r = await API.signup({ name: f.name, email: f.email, password: f.pass, phone: f.phone.replace(/\D/g, ""), role: f.role, skill: f.role === "provider" ? f.skill : "", society: f.society, experience: f.exp || "" }); localStorage.setItem("sc_token", r.token); onLogin(r.user); } catch (e) { setErr(e.message); } setLoad(false); }} disabled={load || signupOtp.length < 6} style={{ ...authS.submitBtn, opacity: (load || signupOtp.length < 6) ? 0.5 : 1 }}>{load ? "Creating Account…" : "Verify & Join →"}</button>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginTop: 10 }}>
                    <button onClick={() => { setSignupOtpStep(false); setSignupOtp(""); setSignupDevOtp(""); setSignupSessionKey(null); setErr(""); }} style={{ background: "none", border: "none", color: "#64748B", fontSize: 12, cursor: "pointer", padding: "8px" }}>← Back</button>
                    <span style={{ color: "#E2E8F0", fontSize: 12 }}>|</span>
                    <button disabled={resendCooldown > 0} onClick={async () => { setErr(""); setSignupOtp(""); const newOtp = String(Math.floor(100000 + Math.random() * 900000)); const ejsConfigured = window.EMAILJS_SERVICE_ID !== "YOUR_SERVICE_ID"; if (ejsConfigured) { try { await emailjs.send(window.EMAILJS_SERVICE_ID, window.EMAILJS_TEMPLATE_ID, { to_email: f.email, to_name: f.name, otp_code: newOtp, app_name: "SocietyConnect" }, window.EMAILJS_PUBLIC_KEY); setSignupDevOtp(""); } catch { setSignupDevOtp(newOtp); } } else { setSignupDevOtp(newOtp); } setSignupSessionKey(newOtp); startCooldown(); }} style={{ background: "none", border: "none", color: resendCooldown > 0 ? "#94A3B8" : "#7C3AED", fontSize: 12, cursor: resendCooldown > 0 ? "not-allowed" : "pointer", padding: "8px", fontWeight: 700 }}>{resendCooldown > 0 ? `Resend in ${resendCooldown}s` : "↻ Resend OTP"}</button>
                  </div>
                </div>}

                {/* ── MAIN FORM ── */}
                {!otpStep && !signupOtpStep && <>
                  {/* Tab */}
                  <div style={authS.tab}>
                    {["login", "signup"].map(m => (
                      <button key={m} onClick={() => switchMode(m)} style={authS.tabBtn(mode === m)}>
                        {m === "login" ? "Sign In" : "Create Account"}
                      </button>
                    ))}
                  </div>

                  <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                    {mode === "signup" && (
                      <div className="auth-field-reveal" style={{ animationDelay: "0.05s" }}>
                        <label style={authS.label}>Full Name *</label>
                        <input className="auth-input" value={f.name} onChange={e => sv("name", e.target.value)} placeholder="Full Name *" style={IS} />
                      </div>
                    )}

                    <div className="auth-field-reveal" style={{ animationDelay: mode === "signup" ? "0.1s" : "0.05s" }}>
                      <label style={authS.label}>Email Address *</label>
                      <input className="auth-input" type="email" value={f.email} onChange={e => sv("email", e.target.value)} placeholder="Email address *" style={IS} />
                    </div>

                    <div className="auth-field-reveal" style={{ animationDelay: mode === "signup" ? "0.15s" : "0.1s" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <label style={{ ...authS.label, margin: 0 }}>Password *</label>
                        {mode === "login" && <button onClick={() => setShowForgot(true)} style={{ background: "none", border: "none", color: "#7C3AED", fontSize: 12, fontWeight: 700, cursor: "pointer", padding: 0 }}>Forgot Password?</button>}
                      </div>
                      <PwInput value={f.pass} onChange={e => sv("pass", e.target.value)} placeholder={mode === "login" ? "Your password" : "Password * (min 6 chars)"} t={{ border: "#E2E8F0", inp: "#F8FAFC", txt: "#1A1F36" }} onKeyDown={e => e.key === "Enter" && mode === "login" && submit()} />
                    </div>

                    {mode === "signup" && <>
                      <div className="auth-field-reveal" style={{ animationDelay: "0.2s" }}>
                        <label style={authS.label}>Phone Number *</label>
                        <div style={{ position: "relative" }}>
                          <span style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)", fontSize: 13, color: "#8888A0", pointerEvents: "none", zIndex: 1, fontWeight: 600, letterSpacing: "0.5px" }}>IN +91</span>
                          <input className="auth-input" value={f.phone} onChange={e => sv("phone", e.target.value.replace(/\D/g, ""))} placeholder="10-digit mobile number *" maxLength={10} style={{ ...IS, paddingLeft: "76px" }} />
                        </div>
                      </div>

                      <div className="auth-field-reveal" style={{ animationDelay: "0.25s" }}>
                        <label style={authS.label}>I Am A *</label>
                        <div style={{ display: "flex", gap: 8, background: "#F1F5F9", borderRadius: 14, padding: 4, border: "1px solid #E2E8F0" }}>
                          {["customer", "provider"].map(r => {
                            const isActive = f.role === r;
                            return (
                              <button key={r} className="role-btn" onClick={() => sv("role", r)} style={{
                                flex: 1, padding: "12px 10px", borderRadius: 11,
                                border: isActive ? "1.5px solid #7C3AED" : "1.5px solid transparent",
                                fontSize: 13, fontWeight: 700,
                                background: isActive ? "#fff" : "transparent",
                                color: isActive ? "#7C3AED" : "#64748B", cursor: "pointer",
                                boxShadow: isActive ? "0 2px 8px rgba(124,58,237,0.15)" : "none",
                              }}>
                                {r === "customer" ? "🏠 Resident" : "🔧 Provider"}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {f.role === "provider" && <>
                        <div className="auth-field-reveal" style={{ animationDelay: "0.3s" }}>
                          <label style={{ ...authS.label, display: "flex", alignItems: "baseline", gap: 6 }}>YOUR SKILL(S) * <span style={{ fontWeight: 400, fontSize: 10, color: "#6E6E82", textTransform: "none", letterSpacing: 0 }}>(select one or more)</span></label>
                          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                            {["Plumber", "Electrician", "Cleaner", "Shifting"].map((sk, si) => {
                              const sel = (f.skill || "").split(",").map(x => x.trim()).filter(Boolean);
                              const checked = sel.includes(sk);
                              return (
                                <label key={sk} className="skill-checkbox" onClick={() => { let cur = sel.includes(sk) ? sel.filter(x => x !== sk) : [...sel, sk]; sv("skill", cur.join(",")); }}
                                  style={{
                                    display: "flex", alignItems: "center", gap: 9, padding: "11px 13px", borderRadius: 12,
                                    border: `1.5px solid ${checked ? "#7C3AED" : "#E2E8F0"}`,
                                    background: checked ? "#F5F3FF" : "#F8FAFC", cursor: "pointer",
                                    animation: `scrollRevealUp 0.4s ${0.32 + si * 0.06}s both cubic-bezier(0.16,1,0.3,1)`
                                  }}>
                                  <div style={{ width: 18, height: 18, borderRadius: 5, border: `2px solid ${checked ? "#7C3AED" : "#D1D5DB"}`, background: checked ? "#7C3AED" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all 0.2s" }}>
                                    {checked && <span style={{ color: "#fff", fontSize: 11, fontWeight: 700 }}>✓</span>}
                                  </div>
                                  <span style={{ fontSize: 13, fontWeight: 600, color: checked ? "#7C3AED" : "#64748B" }}>{SVC_ICO[sk]} {sk}</span>
                                </label>
                              );
                            })}
                          </div>
                          {f.role === "provider" && !(f.skill && f.skill.trim()) && <p style={{ fontSize: 12, color: "#DC2626", marginTop: 8, fontWeight: 500, animation: "fadeUp 0.3s ease" }}>Please select at least one skill.</p>}
                        </div>
                        <div className="auth-field-reveal" style={{ animationDelay: "0.38s" }}>
                          <label style={authS.label}>Experience</label>
                          <input className="auth-input" value={f.exp} onChange={e => sv("exp", e.target.value)} placeholder="Experience (e.g. 3 yrs)" style={IS} />
                        </div>
                      </>}

                      <div className="auth-field-reveal" style={{ animationDelay: f.role === "provider" ? "0.44s" : "0.3s" }}>
                        <label style={authS.label}>YOUR SOCIETY *</label>
                        <SocietySelect value={f.society} onChange={v => sv("society", v)} t={{ border: "#E2E8F0", inp: "#F8FAFC", txt: "#1A1F36", muted: "#64748B" }} />
                      </div>
                    </>}

                    {err && <div style={{ ...authS.errBox, animation: "scrollRevealUp 0.3s ease" }}>{err}</div>}

                    <button className="auth-btn-pri" onClick={submit} disabled={load}
                      style={{
                        ...authS.submitBtn,
                        background: "linear-gradient(135deg,#7C3AED,#8B5CF6)",
                        color: "#ffffff",
                        opacity: load ? 0.6 : 1,
                        boxShadow: "0 4px 20px rgba(124,58,237,0.35)",
                        fontSize: 15, fontWeight: 700, letterSpacing: "0.3px",
                        animation: mode === "signup" ? (f.role === "provider" ? "scrollRevealUp 0.5s 0.5s both cubic-bezier(0.16,1,0.3,1)" : "scrollRevealUp 0.5s 0.35s both cubic-bezier(0.16,1,0.3,1)") : "scrollRevealUp 0.5s 0.2s both cubic-bezier(0.16,1,0.3,1)",
                      }}>
                      {load ? "Please wait…" : mode === "login" ? "Sign In →" : "Create Account →"}
                    </button>
                  </div>
                </>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TopBar({ act, t, dark, setDark, setOpen, unread, setAct, reqs }) {
      const titles = { dash: "Dashboard", rules: "Rule Book", svc: "Request Service", chat: "Chat", hist: "Service History", notif: "Notifications", profile: "Profile", admin: "Admin Panel", prov: "My Jobs", support: "Contact Us" };
      const [sq, setSq] = useState("");
      const [showSearch, setShowSearch] = useState(false);
      const [results, setResults] = useState([]);
      const [aiAnswer, setAiAnswer] = useState("");
      const [searching, setSearching] = useState(false);

      const doSearch = async (query) => {
        if (!query.trim()) { setResults([]); setAiAnswer(""); return; }
        setSearching(true);
        const q = query.toLowerCase();
        const matched = (reqs || []).filter(r =>
          r.service_type?.toLowerCase().includes(q) ||
          r.description?.toLowerCase().includes(q) ||
          r.status?.toLowerCase().includes(q) ||
          (r.provider_name||"").toLowerCase().includes(q)
        );
        setResults(matched);
        const ctx = (reqs || []).length > 0
          ? (reqs || []).map(r => `[${r.service_type}] status:${r.status} desc:"${r.description||""}" provider:${r.provider_name||"unassigned"}`).join("\n")
          : "No requests yet.";
        const ans = await ai(`User searched: "${query}"\n\nService request history:\n${ctx}\n\nGive a concise 1-2 sentence friendly summary of what's relevant to the search. Mention counts and statuses.`, "You are a helpful assistant for a residential society app. Be brief.");
        setAiAnswer(ans);
        setSearching(false);
      };

      React.useEffect(() => {
        if (!sq.trim()) { setResults([]); setAiAnswer(""); return; }
        const tid = setTimeout(() => doSearch(sq), 420);
        return () => clearTimeout(tid);

      const [q, setQ] = useState("");
      const [cat, setCat] = useState("All");
      const [aiQ, setAiQ] = useState("");
      const [aiA, setAiA] = useState("");
      const [aiLoad, setAiLoad] = useState(false);
      const [showAi, setShowAi] = useState(false);
      const [expanded, setExpanded] = useState(null);
      const rules = SHAPOORJI_RULES;
      const cats = ["All", ...new Set(rules.map(r => r.cat))];
      const filtered = rules.filter(r => (cat === "All" || r.cat === cat) && (q === "" || r.title.toLowerCase().includes(q.toLowerCase()) || r.body.toLowerCase().includes(q.toLowerCase())));
      const askAI = async () => {
        if (!aiQ.trim()) return; setAiLoad(true); setAiA("");
        const ctx = rules.map(r => `[${r.title}]: ${r.body}`).join("\n\n");
        const ans = await ai(aiQ, `You are a helpful assistant for residents of Shapoorji Complex. Answer based ONLY on these rules:\n\n${ctx}\n\nBe concise and friendly.`);
        setAiA(ans); setAiLoad(false);
      };

      const catColorMap = {
        "All": { bg: "#EEF2FF", col: "#6366F1" }, "Eligibility": { bg: "#ECFDF5", col: "#10B981" },
        "Parking": { bg: "#EFF6FF", col: "#3B82F6" }, "Possession": { bg: "#F5F3FF", col: "#8B5CF6" },
        "Payment": { bg: "#FFF7ED", col: "#F97316" }, "Maintenance": { bg: "#F0FDF4", col: "#22C55E" },
        "Modifications": { bg: "#FFFBEB", col: "#F59E0B" }, "Cancellation": { bg: "#FEF2F2", col: "#EF4444" },
        "Legal": { bg: "#EFF6FF", col: "#0EA5E9" }
      };

      return (
        <div className="fade-in">
          <style>{`
            .rule-card { transition: all 0.18s cubic-bezier(0.16,1,0.3,1); cursor: pointer; }
            .rule-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,0.08) !important; }
            .cat-pill { transition: all 0.15s ease; cursor: pointer; }
            .cat-pill:hover { opacity: 0.85; }
          `}</style>

          {/* Header */}
          <div style={{ marginBottom: 22 }}>
            <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 26, color: "#1A1F36", margin: "0 0 4px", letterSpacing: "-0.3px" }}>Rule Book</h2>
            <p style={{ color: "#6B7A99", fontSize: 13, margin: 0 }}>Official rules — Shapoorji Complex, New Town</p>
          </div>

          {/* Search + AI toggle */}
          <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
            <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 8, background: "#fff", border: "1.5px solid #EAF0F6", borderRadius: 12, padding: "10px 14px" }}>
              <span style={{ color: "#9AA5B8", fontSize: 14 }}>🔍</span>
              <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search rules…"
                style={{ border: "none", background: "none", outline: "none", fontSize: 13, color: "#1A1F36", width: "100%", fontFamily: "inherit" }} />
            </div>
            <button onClick={() => setShowAi(!showAi)} className="cat-pill"
              style={{ padding: "10px 18px", borderRadius: 12, border: `1.5px solid ${showAi ? "#7C6FCD" : "#EAF0F6"}`, fontSize: 13, fontWeight: 700, background: showAi ? "#7C6FCD" : "#fff", color: showAi ? "#fff" : "#6B7A99", cursor: "pointer", whiteSpace: "nowrap" }}>
              🤖 Ask AI
            </button>
          </div>

          {/* AI panel */}
          {showAi && (
            <div style={{ marginBottom: 16, borderRadius: 14, padding: 18, background: "#F5F3FF", border: "1.5px solid #DDD6FE" }}>
              <p style={{ fontSize: 13, fontWeight: 700, color: "#6D28D9", margin: "0 0 12px", display: "flex", alignItems: "center", gap: 8 }}>🤖 Ask AI about Society Rules</p>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={aiQ} onChange={e => setAiQ(e.target.value)} placeholder="Ask anything about the rules…" onKeyDown={e => e.key === "Enter" && askAI()}
                  style={{ flex: 1, padding: "10px 14px", borderRadius: 10, border: "1.5px solid #DDD6FE", background: "#fff", color: "#1A1F36", fontSize: 13, outline: "none", fontFamily: "inherit" }} />
                <button onClick={askAI} disabled={aiLoad}
                  style={{ padding: "10px 18px", borderRadius: 10, border: "none", background: "#7C6FCD", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", opacity: aiLoad ? 0.6 : 1 }}>{aiLoad ? "…" : "Ask"}</button>
              </div>
              {aiA && <div style={{ marginTop: 12, padding: "12px 14px", background: "#fff", borderRadius: 10, fontSize: 13, color: "#1A1F36", lineHeight: 1.8, borderLeft: "3px solid #7C6FCD" }}>{aiA}</div>}
            </div>
          )}

          {/* Category pills */}
          <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
            {cats.map(c => {
              const cm = catColorMap[c] || { bg: "#F4F6FA", col: "#6B7A99" };
              const active = cat === c;
              return (
                <button key={c} onClick={() => setCat(c)} className="cat-pill"
                  style={{ padding: "6px 16px", borderRadius: 20, border: `1.5px solid ${active ? cm.col : "#EAF0F6"}`, fontSize: 12, fontWeight: 700, background: active ? cm.bg : "#fff", color: active ? cm.col : "#6B7A99" }}>
                  {c}
                </button>
              );
            })}
          </div>

          {/* Rule cards */}
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {filtered.map((r, i) => {
              const cm = catColorMap[r.cat] || { bg: "#F4F6FA", col: "#6B7A99" };
              const open = expanded === r.id;
              return (
                <div key={r.id} className="rule-card" onClick={() => setExpanded(open ? null : r.id)}
                  style={{ borderRadius: 14, overflow: "hidden", background: "#fff", border: `1.5px solid ${open ? cm.col + "55" : "#EAF0F6"}`, boxShadow: open ? `0 4px 20px ${cm.col}18` : "0 1px 4px rgba(0,0,0,0.04)", animation: `slideUp 0.35s ${0.04 * i}s both ease` }}>
                  {/* colored top bar */}
                  <div style={{ height: 3, background: `linear-gradient(90deg,${cm.col},transparent)` }} />
                  <div style={{ padding: "14px 18px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <div style={{ width: 40, height: 40, borderRadius: 12, background: cm.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>{r.ico}</div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                          <p style={{ fontSize: 14, fontWeight: 700, color: "#1A1F36", margin: 0 }}>{r.title}</p>
                          <span style={{ fontSize: 10, background: cm.bg, color: cm.col, padding: "2px 10px", borderRadius: 20, fontWeight: 700, border: `1px solid ${cm.col}33` }}>{r.cat}</span>
                        </div>
                      </div>
                      <span style={{ color: "#9AA5B8", fontSize: 16, transition: "transform 0.25s", transform: open ? "rotate(180deg)" : "rotate(0deg)", flexShrink: 0 }}>⌄</span>
                    </div>
                    {open && <p style={{ fontSize: 13, color: "#4B5563", margin: "12px 0 0", lineHeight: 1.8, paddingLeft: 52, animation: "fadeIn 0.22s ease" }}>{r.body}</p>}
                  </div>
                </div>
              );
            })}
            {filtered.length === 0 && (
              <div style={{ textAlign: "center", color: "#9AA5B8", padding: 48 }}>
                <div style={{ fontSize: 32, marginBottom: 8 }}>📋</div>
                <p style={{ margin: 0, fontSize: 14 }}>No rules found.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════
       SERVICE REQUEST
    ══════════════════════════════════════ */
    function ServiceReq({ user, t, onRequestCreated, setNotifs }) {
      const [step, setStep] = useState(1);
      const [f, setF] = useState({ svc: "", desc: "", emergency: false });
      const [allProviders, setAllProviders] = useState([]);
      const [provPage, setProvPage] = useState(0);
      const [selectedProvider, setSelectedProvider] = useState(null);
      const [provLoad, setProvLoad] = useState(false);
      const [sub, setSub] = useState(false);
      const [tlLoad, setTlLoad] = useState(false);
      const [tld, setTld] = useState("");
      const [err, setErr] = useState("");
      const [imageData, setImageData] = useState("");
      const [imagePreview, setImagePreview] = useState("");
      const sv = k => v => setF(p => ({ ...p, [k]: v }));
      const est = f.svc ? PRICE[f.svc] : null;
      const PAGE_SIZE = 3;
      const pagedProviders = allProviders.slice(provPage * PAGE_SIZE, (provPage + 1) * PAGE_SIZE);
      const hasMore = (provPage + 1) * PAGE_SIZE < allProviders.length;
      const hasPrev = provPage > 0;

      const fetchProviders = async (svc) => {
        setProvLoad(true); setAllProviders([]); setSelectedProvider(null);
        try { const list = await API.getProviders(svc, user.society); setAllProviders(list || []); } catch { setAllProviders([]); }
        setProvLoad(false);
      };

      const translate = async () => { if (!f.desc) return; setTlLoad(true); const r = await ai(f.desc, "Translate to English. Return only the translation."); setTld(r); setTlLoad(false); };

      const go = async () => {
        setErr("");
        if (step === 1) { if (!f.svc) return; setStep(2); }
        else if (step === 2) {
          if (!f.desc) return;
          setProvPage(0);
          await fetchProviders(f.svc);
          setStep(3);
        }
        else if (step === 3) {
          setSub(true);
          try {
            const payload = { service_type: f.svc, description: f.desc, emergency: f.emergency ? 1 : 0 };
            if (selectedProvider) payload.preferred_provider_id = selectedProvider.id;
            if (imageData) payload.image_data = imageData;
            const req = await API.createRequest(payload);
            onRequestCreated(req);
            setNotifs(p => [{ id: Date.now(), type: "info", icon: "👷", title: "Request Submitted", message: `${f.svc} request submitted.`, time: "just now", read_flag: 0 }, ...p]);
            setStep(4);
          } catch (e) { setErr(e.message); }
          setSub(false);
        }
      };

      /* ── service card definitions ── */
      const SVC_CARDS = [
        { name: "Plumber",     emoji: "🔧", bg: "#EEF2FF", circle: "#C7D2FE", desc: "Pipe repair, leakage, installation & more",    col: "#6366F1" },
        { name: "Electrician", emoji: "⚡", bg: "#FFFBEB", circle: "#FDE68A", desc: "Wiring, fan, switchboard, light installation & more", col: "#F59E0B" },
        { name: "Cleaner",     emoji: "🧹", bg: "#ECFDF5", circle: "#A7F3D0", desc: "Home cleaning, bathroom, kitchen & more",       col: "#10B981" },
        { name: "Shifting",    emoji: "📦", bg: "#FFF7ED", circle: "#FED7AA", desc: "House shifting, office moving & more",           col: "#F97316" },
      ];

      const stepLabels = [
        { n: 1, title: "Service",  sub: "Choose a service" },
        { n: 2, title: "Details",  sub: "Describe your needs" },
        { n: 3, title: "Provider", sub: "Choose a provider" },
        { n: 4, title: "Confirm",  sub: "Review & confirm" },
      ];

      return (
        <div className="fade-in">
          <style>{`
            .svc-card { transition: all 0.18s cubic-bezier(0.16,1,0.3,1); cursor: pointer; }
            .svc-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,0.10) !important; }
            .svc-card.selected { transform: translateY(-2px); }
            .svc-next-btn { transition: all 0.15s; }
            .svc-next-btn:hover:not(:disabled) { background: #6D28D9 !important; transform: translateX(2px); }
            .svc-next-btn:disabled { opacity: 0.45; cursor: not-allowed !important; }
          `}</style>

          {/* Page title */}
          <div style={{ marginBottom: 22 }}>
            <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 26, color: "#1A1F36", margin: "0 0 3px", letterSpacing: "-0.3px" }}>Request a Service</h2>
            <p style={{ color: "#6B7A99", fontSize: 13, margin: 0 }}>{user.society || "Your Society"}</p>
          </div>

          {/* Stepper */}
          <div style={{ background: "#fff", borderRadius: 16, border: "1px solid #EAF0F6", padding: "18px 28px", marginBottom: 16, display: "flex", alignItems: "center", gap: 0 }}>
            {stepLabels.map((s, i) => {
              const done = step > s.n;
              const active = step === s.n;
              return (
                <React.Fragment key={s.n}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                    <div style={{
                      width: 34, height: 34, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                      background: done ? "#7C6FCD" : active ? "#7C6FCD" : "#F0F2F8",
                      color: done || active ? "#fff" : "#9AA5B8",
                      fontSize: done ? 14 : 13, fontWeight: 700, flexShrink: 0,
                      boxShadow: active ? "0 0 0 4px rgba(124,111,205,0.18)" : "none",
                      transition: "all 0.2s"
                    }}>
                      {done ? "✓" : s.n}
                    </div>
                    <div>
                      <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: active ? "#1A1F36" : done ? "#7C6FCD" : "#9AA5B8" }}>{s.title}</p>
                      <p style={{ margin: 0, fontSize: 11, color: "#9AA5B8" }}>{s.sub}</p>
                    </div>
                  </div>
                  {i < 3 && <div style={{ flex: 1, height: 2, background: done ? "#7C6FCD" : "#EAF0F6", margin: "0 14px", borderRadius: 2, transition: "background 0.3s" }} />}
                </React.Fragment>
              );
            })}
          </div>

          {/* Main card */}
          <div style={{ background: "#fff", borderRadius: 16, border: "1px solid #EAF0F6", overflow: "hidden" }}>
            <ErrBox msg={err} t={t} />

            {/* ── STEP 1: Choose Service ── */}
            {step === 1 && (
              <div style={{ padding: "28px 28px 0" }}>
                <p style={{ fontSize: 17, fontWeight: 700, color: "#1A1F36", margin: "0 0 4px" }}>What service do you need?</p>
                <p style={{ fontSize: 13, color: "#6B7A99", margin: "0 0 22px" }}>Select the type of service you're looking for</p>

                <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 20 }}>
                  {SVC_CARDS.map(s => {
                    const sel = f.svc === s.name;
                    return (
                      <div key={s.name} className={`svc-card${sel ? " selected" : ""}`}
                        onClick={() => sv("svc")(s.name)}
                        style={{
                          borderRadius: 14, border: `2px solid ${sel ? s.col : "#EAF0F6"}`,
                          background: sel ? s.bg : "#fff",
                          padding: "20px 14px 18px", textAlign: "center", position: "relative",
                          boxShadow: sel ? `0 4px 20px ${s.col}28` : "0 1px 4px rgba(0,0,0,0.05)"
                        }}>
                        {/* radio dot */}
                        <div style={{
                          position: "absolute", top: 10, right: 10, width: 18, height: 18, borderRadius: "50%",
                          border: `2px solid ${sel ? s.col : "#D1D5DB"}`,
                          background: sel ? s.col : "transparent",
                          display: "flex", alignItems: "center", justifyContent: "center"
                        }}>
                          {sel && <div style={{ width: 7, height: 7, borderRadius: "50%", background: "#fff" }} />}
                        </div>
                        {/* icon circle */}
                        <div style={{ width: 64, height: 64, borderRadius: "50%", background: s.circle, margin: "0 auto 12px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>{s.emoji}</div>
                        <p style={{ fontSize: 15, fontWeight: 700, color: "#1A1F36", margin: "0 0 6px" }}>{s.name}</p>
                        <p style={{ fontSize: 11, color: "#6B7A99", margin: "0 0 10px", lineHeight: 1.5 }}>{s.desc}</p>
                        <p style={{ fontSize: 12, fontWeight: 700, color: s.col, margin: 0 }}>₹{PRICE[s.name][0]}–{PRICE[s.name][1]}/{UNIT[s.name]}</p>
                      </div>
                    );
                  })}
                </div>

                {/* Emergency toggle */}
                <div style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "14px 18px", borderRadius: 12, background: f.emergency ? "#FFF5F5" : "#FFF8F8",
                  border: `1px solid ${f.emergency ? "#FCA5A5" : "#FECACA"}`, marginBottom: 20
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <span style={{ fontSize: 22 }}>🚨</span>
                    <div>
                      <p style={{ margin: 0, fontSize: 14, fontWeight: 700, color: "#EF4444" }}>Emergency Request</p>
                      <p style={{ margin: 0, fontSize: 12, color: "#9CA3AF" }}>Get priority support. We'll connect you faster.</p>
                    </div>
                  </div>
                  {/* Toggle switch */}
                  <div onClick={() => sv("emergency")(!f.emergency)} style={{
                    width: 44, height: 24, borderRadius: 99, background: f.emergency ? "#EF4444" : "#D1D5DB",
                    position: "relative", cursor: "pointer", transition: "background 0.2s", flexShrink: 0
                  }}>
                    <div style={{
                      position: "absolute", top: 3, left: f.emergency ? 23 : 3, width: 18, height: 18,
                      borderRadius: "50%", background: "#fff", boxShadow: "0 1px 4px rgba(0,0,0,0.2)",
                      transition: "left 0.2s"
                    }} />
                  </div>
                </div>

                {/* Footer trust + next btn */}
                <div style={{ borderTop: "1px solid #EAF0F6", padding: "16px 0", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <div style={{ display: "flex", gap: 28 }}>
                    {[["🔒", "Secure & Safe", "Your information is protected"], ["✅", "Verified Providers", "Trusted & background checked"], ["💬", "24/7 Support", "We're here to help anytime"]].map(([ic, lbl, sub]) => (
                      <div key={lbl} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ fontSize: 16 }}>{ic}</span>
                        <div>
                          <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: "#1A1F36" }}>{lbl}</p>
                          <p style={{ margin: 0, fontSize: 10, color: "#9AA5B8" }}>{sub}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button className="svc-next-btn" onClick={go} disabled={!f.svc}
                    style={{ display: "flex", alignItems: "center", gap: 8, padding: "12px 24px", borderRadius: 12, border: "none", background: "#7C3AED", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                    Next: Add Details <span style={{ fontSize: 16 }}>→</span>
                  </button>
                </div>
              </div>
            )}

            {/* ── STEP 2: Details ── */}
            {step === 2 && (
              <div style={{ padding: 28 }}>
                <p style={{ fontSize: 17, fontWeight: 700, color: "#1A1F36", margin: "0 0 4px" }}>Describe your problem</p>
                <p style={{ fontSize: 13, color: "#6B7A99", margin: "0 0 18px" }}>Help the provider understand what needs to be done</p>
                <textarea value={f.desc} onChange={e => sv("desc")(e.target.value)} placeholder={`Describe your ${f.svc.toLowerCase()} issue in detail…`}
                  style={{ width: "100%", padding: "14px 16px", borderRadius: 12, border: "1.5px solid #EAF0F6", background: "#FAFBFF", color: "#1A1F36", fontSize: 14, resize: "vertical", minHeight: 110, outline: "none", boxSizing: "border-box", fontFamily: "inherit", lineHeight: 1.6, transition: "border-color 0.15s" }}
                  onFocus={e => e.target.style.borderColor = "#7C6FCD"}
                  onBlur={e => e.target.style.borderColor = "#EAF0F6"} />
                <div style={{ display: "flex", gap: 8, margin: "10px 0 16px" }}>
                  <button onClick={translate} disabled={tlLoad || !f.desc}
                    style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 14px", borderRadius: 20, border: "1.5px solid #EAF0F6", background: "transparent", color: "#6B7A99", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                    🌐 {tlLoad ? "Translating…" : "Translate to English"}
                  </button>
                </div>
                {tld && <div style={{ padding: "12px 14px", background: "rgba(99,102,241,0.06)", border: "1px solid rgba(99,102,241,0.18)", borderRadius: 10, marginBottom: 16 }}>
                  <p style={{ fontSize: 11, color: "#818cf8", margin: "0 0 3px", fontWeight: 700, letterSpacing: "0.5px" }}>🌐 ENGLISH TRANSLATION</p>
                  <p style={{ fontSize: 13, color: "#1A1F36", margin: 0 }}>{tld}</p>
                </div>}

                {/* Photo upload */}
                <div style={{ marginBottom: 20 }}>
                  <p style={{ fontSize: 13, fontWeight: 700, color: "#1A1F36", marginBottom: 8 }}>📷 Add a Photo <span style={{ fontWeight: 400, color: "#9AA5B8" }}>(optional)</span></p>
                  {!imagePreview ? (
                    <label style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, padding: "22px", border: "2px dashed #D1D5DB", borderRadius: 12, cursor: "pointer", background: "#FAFBFF" }}
                      onDragOver={e => e.preventDefault()}
                      onDrop={e => { e.preventDefault(); const file = e.dataTransfer.files[0]; if (file && file.type.startsWith("image/")) { const r = new FileReader(); r.onload = ev => { setImagePreview(ev.target.result); setImageData(ev.target.result); }; r.readAsDataURL(file); } }}>
                      <span style={{ fontSize: 28 }}>📸</span>
                      <span style={{ fontSize: 13, color: "#6B7A99" }}>Tap to upload or drag & drop</span>
                      <span style={{ fontSize: 11, color: "#9AA5B8" }}>JPG, PNG — max 2MB</span>
                      <input type="file" accept="image/*" style={{ display: "none" }} onChange={e => { const file = e.target.files[0]; if (file) { const r = new FileReader(); r.onload = ev => { setImagePreview(ev.target.result); setImageData(ev.target.result); }; r.readAsDataURL(file); } }} />
                    </label>
                  ) : (
                    <div style={{ position: "relative", display: "inline-block" }}>
                      <img src={imagePreview} alt="preview" style={{ maxHeight: 140, borderRadius: 10, border: "1.5px solid #EAF0F6" }} />
                      <button onClick={() => { setImagePreview(""); setImageData(""); }}
                        style={{ position: "absolute", top: -8, right: -8, width: 22, height: 22, borderRadius: "50%", background: "#EF4444", border: "none", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>✕</button>
                    </div>
                  )}
                </div>

                <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 16, borderTop: "1px solid #EAF0F6" }}>
                  <button onClick={() => setStep(1)} style={{ padding: "11px 22px", borderRadius: 10, border: "1.5px solid #EAF0F6", background: "transparent", color: "#6B7A99", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>← Back</button>
                  <button className="svc-next-btn" onClick={go} disabled={!f.desc}
                    style={{ display: "flex", alignItems: "center", gap: 8, padding: "11px 24px", borderRadius: 12, border: "none", background: "#7C3AED", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                    Next: Choose Provider <span>→</span>
                  </button>
                </div>
              </div>
            )}

            {/* ── STEP 3: Provider ── */}
            {step === 3 && (
              <div style={{ padding: 28 }}>
                <p style={{ fontSize: 17, fontWeight: 700, color: "#1A1F36", margin: "0 0 4px" }}>Choose a Provider</p>
                <p style={{ fontSize: 13, color: "#6B7A99", margin: "0 0 18px" }}>Select your preferred provider, or we'll auto-assign the best available</p>
                {provLoad ? (
                  <div style={{ textAlign: "center", padding: "40px 0", color: "#9AA5B8", fontSize: 14 }}>Finding providers near you…</div>
                ) : allProviders.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "40px 0" }}>
                    <div style={{ fontSize: 36, marginBottom: 10 }}>🔍</div>
                    <p style={{ color: "#6B7A99", fontSize: 14, margin: "0 0 6px" }}>No providers found nearby</p>
                    <p style={{ color: "#9AA5B8", fontSize: 12, margin: 0 }}>We'll auto-assign the best available provider</p>
                  </div>
                ) : (
                  <>
                    {/* Auto-assign option */}
                    <div onClick={() => setSelectedProvider(null)}
                      style={{ padding: "13px 16px", borderRadius: 12, border: `2px solid ${!selectedProvider ? "#7C6FCD" : "#EAF0F6"}`, background: !selectedProvider ? "#F5F3FF" : "#fff", marginBottom: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: 12 }}>
                      <div style={{ width: 38, height: 38, borderRadius: "50%", background: "#EEF2FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🤖</div>
                      <div style={{ flex: 1 }}>
                        <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#1A1F36" }}>Auto-assign (Recommended)</p>
                        <p style={{ margin: 0, fontSize: 11, color: "#9AA5B8" }}>We'll match you with the best available provider</p>
                      </div>
                      {!selectedProvider && <span style={{ fontSize: 16, color: "#7C6FCD" }}>✓</span>}
                    </div>
                    {pagedProviders.map(p => (
                      <div key={p.id} onClick={() => setSelectedProvider(p)}
                        style={{ padding: "13px 16px", borderRadius: 12, border: `2px solid ${selectedProvider?.id === p.id ? "#7C6FCD" : "#EAF0F6"}`, background: selectedProvider?.id === p.id ? "#F5F3FF" : "#fff", marginBottom: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ width: 38, height: 38, borderRadius: "50%", background: "linear-gradient(135deg,#7C6FCD,#5A4FCC)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, color: "#fff", fontWeight: 700, flexShrink: 0 }}>{(p.name || "?")[0]?.toUpperCase()}</div>
                        <div style={{ flex: 1 }}>
                          <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#1A1F36" }}>{p.name}</p>
                          <p style={{ margin: 0, fontSize: 11, color: "#9AA5B8" }}>{p.exp || "Experienced"} · ⭐ {p.rating || "New"}</p>
                          {p.skill && <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 4 }}>
                            {p.skill.split(",").map(sk => sk.trim()).filter(Boolean).map(sk => (
                              <span key={sk} style={{ fontSize: 10, background: (SVC_COL[sk] || "#666") + "18", color: SVC_COL[sk] || "#888", padding: "2px 8px", borderRadius: 6, fontWeight: 700 }}>{SVC_ICO[sk] || "🔧"} {sk}</span>
                            ))}
                          </div>}
                        </div>
                        {selectedProvider?.id === p.id && <span style={{ fontSize: 16, color: "#7C6FCD" }}>✓</span>}
                      </div>
                    ))}
                    {(hasPrev || hasMore) && <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
                      <button onClick={() => setProvPage(p => p - 1)} disabled={!hasPrev}
                        style={{ padding: "7px 16px", borderRadius: 20, border: "1.5px solid #EAF0F6", background: "transparent", color: hasPrev ? "#6B7A99" : "#D1D5DB", fontSize: 12, fontWeight: 600, cursor: hasPrev ? "pointer" : "default" }}>← Prev</button>
                      <span style={{ fontSize: 12, color: "#9AA5B8", alignSelf: "center" }}>{provPage + 1} / {Math.ceil(allProviders.length / PAGE_SIZE)}</span>
                      <button onClick={() => setProvPage(p => p + 1)} disabled={!hasMore}
                        style={{ padding: "7px 16px", borderRadius: 20, border: "1.5px solid #EAF0F6", background: "transparent", color: hasMore ? "#6B7A99" : "#D1D5DB", fontSize: 12, fontWeight: 600, cursor: hasMore ? "pointer" : "default" }}>Next →</button>
                    </div>}
                  </>
                )}
                {/* Request summary */}
                <div style={{ padding: "14px 16px", background: "#F8F9FF", borderRadius: 12, border: "1px solid #EAF0F6", marginBottom: 18 }}>
                  <p style={{ fontSize: 11, fontWeight: 700, color: "#9AA5B8", margin: "0 0 6px", letterSpacing: "0.8px", textTransform: "uppercase" }}>Request Summary</p>
                  <p style={{ fontSize: 14, fontWeight: 700, color: "#1A1F36", margin: "0 0 3px" }}>{f.svc} {f.emergency ? "⚡ Emergency" : ""}</p>
                  <p style={{ fontSize: 13, color: "#6B7A99", margin: "0 0 4px" }}>{f.desc}</p>
                  {est && <p style={{ fontSize: 12, fontWeight: 700, color: "#7C6FCD", margin: 0 }}>Est: ₹{est[0]}–{est[1]}/{UNIT[f.svc]}</p>}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <button onClick={() => setStep(2)} style={{ padding: "11px 22px", borderRadius: 10, border: "1.5px solid #EAF0F6", background: "transparent", color: "#6B7A99", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>← Back</button>
                  <button className="svc-next-btn" onClick={go} disabled={sub}
                    style={{ display: "flex", alignItems: "center", gap: 8, padding: "11px 24px", borderRadius: 12, border: "none", background: "#7C3AED", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                    {sub ? "Submitting…" : "Confirm Request ✓"}
                  </button>
                </div>
              </div>
            )}

            {/* ── STEP 4: Done ── */}
            {step === 4 && (
              <div style={{ textAlign: "center", padding: "48px 28px" }}>
                <div style={{ fontSize: 56, marginBottom: 16 }}>🎉</div>
