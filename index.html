    /* ══════════════════════════════════════
       TRY MODE — LOGIN GATE MODAL
       Shown when user tries to take an action
       while in try/preview mode
    ══════════════════════════════════════ */
    function TryLoginGate({ onClose, onLogin }) {
      const [mode, setMode] = useState("login");
      const [flipping, setFlipping] = useState(false);
      const [otpStep, setOtpStep] = useState(false);
      const [pendingUserId, setPendingUserId] = useState(null);
      const [loginOtp, setLoginOtp] = useState("");
      const [devOtp, setDevOtp] = useState("");
      const [signupOtpStep, setSignupOtpStep] = useState(false);
      const [signupSessionKey, setSignupSessionKey] = useState(null);
      const [resendCooldown, setResendCooldown] = useState(0);
      const startCooldown = () => { setResendCooldown(30); const iv = setInterval(() => setResendCooldown(p => { if (p <= 1) { clearInterval(iv); return 0; } return p - 1; }), 1000); };
      const [signupOtp, setSignupOtp] = useState("");
      const [signupDevOtp, setSignupDevOtp] = useState("");
      const [f, setF] = useState({ name: "", email: "", pass: "", phone: "", role: "customer", skill: "", society: "Shapoorji Complex, New Town", exp: "" });
      const sv = (k, v) => setF(p => ({ ...p, [k]: v }));
      const [err, setErr] = useState("");
      const [load, setLoad] = useState(false);
      const [showForgot, setShowForgot] = useState(false);

      const switchMode = (newMode) => {
        if (newMode === mode || flipping) return;
        setFlipping(true);
        setTimeout(() => { setMode(newMode); setErr(""); }, 280);
        setTimeout(() => setFlipping(false), 560);
      };

      const IS = {
        width: "100%", padding: "11px 14px", borderRadius: 11,
        border: "1.5px solid #E2E8F0", background: "#F8FAFC",
        color: "#1A1F36", fontSize: 14, boxSizing: "border-box", fontFamily: "inherit",
        transition: "border-color 0.2s", outline: "none", marginBottom: 2,
      };
      const LBL = { fontSize: 11, fontWeight: 700, color: "#64748B", letterSpacing: "0.8px", textTransform: "uppercase", marginBottom: 5, display: "block" };

      const validate = () => {
        if (mode === "login") {
          if (!f.email) return "Email is required.";
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) return "Enter a valid email.";
          if (!f.pass) return "Password is required.";
          return null;
        }
        if (!f.name.trim()) return "Full name is required.";
        if (!f.email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) return "Enter a valid email.";
        if (!f.pass || f.pass.length < 6) return "Password must be at least 6 characters.";
        if (!f.phone || f.phone.replace(/\D/g, "").length < 10) return "Enter a valid 10-digit phone.";
        if (!f.society) return "Please select your society.";
        return null;
      };

      const sendOtpEmail = async (email, name, otpCode) => {
        const svcId = window.EMAILJS_SERVICE_ID, tplId = window.EMAILJS_TEMPLATE_ID, pubKey = window.EMAILJS_PUBLIC_KEY;
        if (svcId !== "YOUR_SERVICE_ID" && tplId !== "YOUR_TEMPLATE_ID" && pubKey !== "YOUR_PUBLIC_KEY") {
          try { await emailjs.send(svcId, tplId, { to_email: email, to_name: name, otp_code: otpCode, app_name: "SocietyConnect" }, pubKey); return true; } catch { return false; }
        }
        return false;
      };

      const submit = async () => {
        const e = validate(); if (e) { setErr(e); return; }
        setLoad(true); setErr("");
        try {
          if (mode === "login") {
            const r = await API.login(f.email, f.pass);
            if (r.otp_required) {
              setPendingUserId(r.user_id);
              if (r.otp) { const sent = await sendOtpEmail(f.email, f.email.split("@")[0], r.otp); if (!sent) setDevOtp(r.otp); }
              setOtpStep(true);
            } else { localStorage.setItem("sc_token", r.token); onLogin(r.user); }
          } else {
            const generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
            const sent = await sendOtpEmail(f.email, f.name, generatedOtp);
            if (!sent) setSignupDevOtp(generatedOtp);
            setSignupSessionKey(generatedOtp); setSignupOtpStep(true);
          }
        } catch (e) { setErr(e.message); }
        setLoad(false);
      };

      const OtpRow = ({ otp, setOtp, prefix, onComplete }) => (
        <div style={{ display: "flex", gap: 8, justifyContent: "center", margin: "16px 0" }}>
          {[0,1,2,3,4,5].map(i => (
            <input key={i} id={`${prefix}${i}`} type="text" inputMode="numeric" maxLength={1} value={otp[i] || ""}
              onChange={e => { const v = e.target.value.replace(/\D/g,"").slice(-1); const arr=(otp+"      ").slice(0,6).split(""); arr[i]=v; const j=arr.join("").slice(0,6); setOtp(j); if(v&&i<5) setTimeout(()=>document.getElementById(`${prefix}${i+1}`)?.focus(),0); if(j.replace(/ /g,"").length===6&&onComplete) onComplete(j.replace(/ /g,"")); }}
              onKeyDown={e => { if(/^[0-9]$/.test(e.key)){e.preventDefault();const arr=(otp+"      ").slice(0,6).split("");arr[i]=e.key;const j=arr.join("").slice(0,6);setOtp(j);if(i<5)setTimeout(()=>document.getElementById(`${prefix}${i+1}`)?.focus(),0);if(j.replace(/ /g,"").length===6&&onComplete)onComplete(j.replace(/ /g,""));} if(e.key==="Backspace"){e.preventDefault();const arr=(otp+"      ").slice(0,6).split("");if(otp[i]?.trim()){arr[i]=" ";setOtp(arr.join("").slice(0,6));if(i>0)setTimeout(()=>document.getElementById(`${prefix}${i-1}`)?.focus(),0);}else if(i>0){arr[i-1]=" ";setOtp(arr.join("").slice(0,6));setTimeout(()=>document.getElementById(`${prefix}${i-1}`)?.focus(),0);}} if(e.key==="ArrowLeft"&&i>0)document.getElementById(`${prefix}${i-1}`)?.focus(); if(e.key==="ArrowRight"&&i<5)document.getElementById(`${prefix}${i+1}`)?.focus(); }}
              onPaste={e => { e.preventDefault(); const p=e.clipboardData.getData("text").replace(/\D/g,"").slice(0,6); if(p){setOtp(p);setTimeout(()=>document.getElementById(`${prefix}${Math.min(p.length,5)}`)?.focus(),10);if(p.length===6&&onComplete)onComplete(p);} }}
              onFocus={e => e.target.select()}
              style={{ width: 40, height: 48, textAlign: "center", fontSize: 20, fontWeight: 700, borderRadius: 10, border: `2px solid ${otp[i]?.trim() ? "#7C3AED" : "#E2E8F0"}`, background: otp[i]?.trim() ? "#F5F3FF" : "#F8FAFC", color: otp[i]?.trim() ? "#7C3AED" : "#94A3B8", fontFamily: "monospace", outline: "none", transition: "all 0.15s" }} />
          ))}
        </div>
      );

      const DevBox = ({ otp: otpVal }) => otpVal ? (
        <div style={{ padding: "9px 12px", background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 9, fontSize: 12, color: "#92400E", marginBottom: 10, textAlign: "center" }}>⚠️ Dev OTP: <b style={{ letterSpacing: 3, fontSize: 16, color: "#7C3AED" }}>{otpVal}</b></div>
      ) : null;
      const ErrRow = ({ msg }) => msg ? <div style={{ padding: "9px 12px", background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 9, fontSize: 13, color: "#DC2626", marginBottom: 10 }}>{msg}</div> : null;

      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", zIndex: 99990, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, backdropFilter: "blur(4px)" }}
          onClick={e => e.target === e.currentTarget && onClose()}>
          {showForgot && <ForgotPasswordModal onClose={() => setShowForgot(false)} />}
          <div style={{ width: "100%", maxWidth: 420, background: "#fff", borderRadius: 24, overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.14), 0 4px 16px rgba(0,0,0,0.06)", position: "relative", maxHeight: "90vh", overflowY: "auto" }}>

            {/* Purple header */}
            <div style={{ background: "linear-gradient(135deg,#7C3AED,#8B5CF6)", padding: "22px 24px 20px", position: "relative" }}>
              <button onClick={onClose} style={{ position: "absolute", top: 12, right: 14, background: "rgba(255,255,255,0.2)", border: "none", color: "#fff", width: 28, height: 28, borderRadius: "50%", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
              {/* Try Mode Banner */}
              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", background: "rgba(255,255,255,0.15)", borderRadius: 10, marginBottom: 16 }}>
                <span style={{ fontSize: 18 }}>👁️</span>
                <div>
                  <p style={{ fontSize: 13, fontWeight: 700, color: "#fff", margin: 0 }}>You're in Try Mode</p>
                  <p style={{ fontSize: 11, color: "rgba(255,255,255,0.8)", margin: "1px 0 0" }}>Sign in or create an account to take this action</p>
                </div>
              </div>
              {/* Logo */}
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 44, height: 44, borderRadius: 13, background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>🏙️</div>
                <div>
                  <h2 style={{ fontFamily: "'Playfair Display',serif", fontSize: 20, color: "#fff", margin: 0 }}>SocietyConnect</h2>
                  <p style={{ color: "rgba(255,255,255,0.75)", fontSize: 12, margin: "2px 0 0" }}>Sign in to continue</p>
                </div>
              </div>
            </div>

            <div style={{ padding: "20px 24px 24px" }}>
              {/* Tabs */}
              <div style={{ display: "flex", background: "#F1F5F9", borderRadius: 13, padding: 4, marginBottom: 18, gap: 4, border: "1px solid #E2E8F0" }}>
                {["login","signup"].map(m => (
                  <button key={m} onClick={() => switchMode(m)} style={{ flex: 1, padding: "9px", borderRadius: 10, border: "none", fontSize: 13, fontWeight: 700, cursor: "pointer", transition: "all 0.2s", background: mode === m ? "#7C3AED" : "transparent", color: mode === m ? "#fff" : "#64748B", boxShadow: mode === m ? "0 2px 8px rgba(124,58,237,0.3)" : undefined }}>
                    {m === "login" ? "Sign In" : "Create Account"}
                  </button>
                ))}
              </div>

              <div style={{ transform: flipping ? "rotateY(90deg) scale(0.96)" : "rotateY(0deg)", opacity: flipping ? 0 : 1, transition: "transform 0.28s ease,opacity 0.28s ease", willChange: "transform,opacity" }}>

                {/* LOGIN OTP STEP */}
                {otpStep && <div>
                  <div style={{ textAlign: "center", marginBottom: 14 }}>
                    <div style={{ fontSize: 34, marginBottom: 8 }}>📧</div>
                    <h3 style={{ fontFamily: "'Playfair Display',serif", fontSize: 18, color: "#1A1F36", margin: "0 0 6px" }}>Verify Identity</h3>
                    <p style={{ fontSize: 13, color: "#64748B", lineHeight: 1.6 }}>OTP sent to <b style={{ color: "#7C3AED" }}>{f.email}</b></p>
                  </div>
                  <DevBox otp={devOtp} /><ErrRow msg={err} />
                  <OtpRow otp={loginOtp} setOtp={setLoginOtp} prefix="glotp" onComplete={joined => { setLoad(true); setErr(""); API.loginVerifyOtp(pendingUserId, joined).then(r => { localStorage.setItem("sc_token", r.token); onLogin(r.user); }).catch(e => { setErr(e.message); setLoad(false); }); }} />
                  <button onClick={async () => { setLoad(true); setErr(""); try { const r = await API.loginVerifyOtp(pendingUserId, loginOtp); localStorage.setItem("sc_token", r.token); onLogin(r.user); } catch(e) { setErr(e.message); } setLoad(false); }} disabled={load || loginOtp.replace(/ /g,"").length < 6}
                    style={{ width: "100%", padding: "12px", borderRadius: 11, border: "none", background: loginOtp.replace(/ /g,"").length === 6 ? "#7C3AED" : "#E2E8F0", color: loginOtp.replace(/ /g,"").length === 6 ? "#fff" : "#94A3B8", fontSize: 14, fontWeight: 700, cursor: "pointer", opacity: load ? 0.6 : 1, transition: "all 0.2s" }}>
                    {load ? "Verifying…" : "Confirm OTP →"}
                  </button>
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10 }}>
                    <button onClick={() => { setOtpStep(false); setLoginOtp(""); setDevOtp(""); setErr(""); }} style={{ background: "none", border: "none", color: "#64748B", fontSize: 12, cursor: "pointer" }}>← Back</button>
                    <button disabled={resendCooldown > 0} onClick={async () => { setErr(""); setLoginOtp(""); try { const r = await API.loginRequestOtp(f.email); setPendingUserId(r.user_id); const sent = await sendOtpEmail(f.email, f.email.split("@")[0], r.otp); if (!sent) setDevOtp(r.otp); else setDevOtp(""); startCooldown(); } catch(e) { setErr(e.message); } }} style={{ background: "none", border: "none", color: resendCooldown > 0 ? "#94A3B8" : "#7C3AED", fontSize: 12, cursor: resendCooldown > 0 ? "not-allowed" : "pointer", fontWeight: 700 }}>{resendCooldown > 0 ? `Resend in ${resendCooldown}s` : "↻ Resend OTP"}</button>
                  </div>
                </div>}

                {/* SIGNUP OTP STEP */}
                {signupOtpStep && <div>
                  <div style={{ textAlign: "center", marginBottom: 14 }}>
                    <div style={{ fontSize: 34, marginBottom: 8 }}>✉️</div>
                    <h3 style={{ fontFamily: "'Playfair Display',serif", fontSize: 18, color: "#1A1F36", margin: "0 0 6px" }}>Verify Your Email</h3>
                    <p style={{ fontSize: 13, color: "#64748B", lineHeight: 1.6 }}>OTP sent to <b style={{ color: "#7C3AED" }}>{f.email}</b></p>
                  </div>
                  <DevBox otp={signupDevOtp} /><ErrRow msg={err} />
                  <OtpRow otp={signupOtp} setOtp={setSignupOtp} prefix="gsotp" onComplete={joined => { if(joined!==signupSessionKey){setErr("Incorrect OTP.");return;} setLoad(true);setErr(""); API.signup({name:f.name,email:f.email,password:f.pass,phone:f.phone.replace(/\D/g,""),role:f.role,skill:f.role==="provider"?f.skill:"",society:f.society,experience:f.exp||""}).then(r=>{localStorage.setItem("sc_token",r.token);onLogin(r.user);}).catch(e=>{setErr(e.message);setLoad(false);}); }} />
                  <button onClick={async () => { if(signupOtp.replace(/ /g,"")!==signupSessionKey){setErr("Incorrect OTP.");return;} setLoad(true);setErr(""); try{const r=await API.signup({name:f.name,email:f.email,password:f.pass,phone:f.phone.replace(/\D/g,""),role:f.role,skill:f.role==="provider"?f.skill:"",society:f.society,experience:f.exp||""});localStorage.setItem("sc_token",r.token);onLogin(r.user);}catch(e){setErr(e.message);} setLoad(false); }} disabled={load || signupOtp.replace(/ /g,"").length < 6}
                    style={{ width: "100%", padding: "12px", borderRadius: 11, border: "none", background: signupOtp.replace(/ /g,"").length === 6 ? "#7C3AED" : "#E2E8F0", color: signupOtp.replace(/ /g,"").length === 6 ? "#fff" : "#94A3B8", fontSize: 14, fontWeight: 700, cursor: "pointer", opacity: load ? 0.6 : 1, transition: "all 0.2s" }}>
                    {load ? "Creating Account…" : "Verify & Join →"}
                  </button>
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10 }}>
                    <button onClick={() => { setSignupOtpStep(false); setSignupOtp(""); setSignupDevOtp(""); setSignupSessionKey(null); setErr(""); }} style={{ background: "none", border: "none", color: "#64748B", fontSize: 12, cursor: "pointer" }}>← Back</button>
                    <button disabled={resendCooldown > 0} onClick={async () => { setErr(""); setSignupOtp(""); const newOtp=String(Math.floor(100000+Math.random()*900000)); const sent=await sendOtpEmail(f.email,f.name,newOtp); if(!sent)setSignupDevOtp(newOtp); else setSignupDevOtp(""); setSignupSessionKey(newOtp); startCooldown(); }} style={{ background: "none", border: "none", color: resendCooldown > 0 ? "#94A3B8" : "#7C3AED", fontSize: 12, cursor: resendCooldown > 0 ? "not-allowed" : "pointer", fontWeight: 700 }}>{resendCooldown > 0 ? `Resend in ${resendCooldown}s` : "↻ Resend OTP"}</button>
                  </div>
                </div>}

                {/* MAIN FORM */}
                {!otpStep && !signupOtpStep && <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {mode === "signup" && <div><label style={LBL}>Full Name</label><input value={f.name} onChange={e => sv("name", e.target.value)} placeholder="Your full name" style={IS} /></div>}
                  <div>
                    <label style={LBL}>Email Address</label>
                    <input type="email" value={f.email} onChange={e => sv("email", e.target.value)} placeholder="you@example.com" onKeyDown={e => e.key === "Enter" && mode === "login" && submit()} style={IS} onFocus={e => e.target.style.borderColor="#7C3AED"} onBlur={e => e.target.style.borderColor="#E2E8F0"} />
                  </div>
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
                      <label style={{ ...LBL, marginBottom: 0 }}>Password</label>
                      {mode === "login" && <button onClick={() => setShowForgot(true)} style={{ background: "none", border: "none", color: "#7C3AED", fontSize: 12, fontWeight: 700, cursor: "pointer", padding: 0 }}>Forgot?</button>}
                    </div>
                    <PwInput value={f.pass} onChange={e => sv("pass", e.target.value)} placeholder={mode === "login" ? "Your password" : "Min 6 characters"} t={{ border: "#E2E8F0", inp: "#F8FAFC", txt: "#1A1F36" }} onKeyDown={e => e.key === "Enter" && mode === "login" && submit()} />
                  </div>
                  {mode === "signup" && <>
                    <div>
                      <label style={LBL}>Phone Number</label>
                      <div style={{ position: "relative" }}>
                        <span style={{ position: "absolute", left: 13, top: "50%", transform: "translateY(-50%)", fontSize: 13, color: "#64748B", pointerEvents: "none", zIndex: 1, fontWeight: 600 }}>🇮🇳 +91</span>
                        <input value={f.phone} onChange={e => sv("phone", e.target.value.replace(/\D/g,""))} placeholder="10-digit number" maxLength={10} style={{ ...IS, paddingLeft: 76 }} onFocus={e => e.target.style.borderColor="#7C3AED"} onBlur={e => e.target.style.borderColor="#E2E8F0"} />
                      </div>
                    </div>
                    <div>
                      <label style={LBL}>I Am A</label>
                      <div style={{ display: "flex", gap: 8, background: "#F1F5F9", borderRadius: 13, padding: 4, border: "1px solid #E2E8F0" }}>
                        {["customer","provider"].map(r => {
                          const isActive = f.role === r;
                          return <button key={r} onClick={() => sv("role", r)} style={{ flex: 1, padding: "10px", borderRadius: 10, border: isActive ? "1.5px solid #7C3AED" : "1.5px solid transparent", fontSize: 13, fontWeight: 700, background: isActive ? "#fff" : "transparent", color: isActive ? "#7C3AED" : "#64748B", cursor: "pointer", boxShadow: isActive ? "0 2px 8px rgba(124,58,237,0.15)" : "none", transition: "all 0.2s" }}>
                            {r === "customer" ? "🏠 Resident" : "🔧 Provider"}
                          </button>;
                        })}
                      </div>
                    </div>
                    {f.role === "provider" && <>
                      <div>
                        <label style={LBL}>Your Skill(s)</label>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                          {["Plumber","Electrician","Cleaner","Shifting"].map(sk => {
                            const sel = (f.skill||"").split(",").map(x=>x.trim()).filter(Boolean);
                            const checked = sel.includes(sk);
                            return <label key={sk} onClick={() => { let cur=sel.includes(sk)?sel.filter(x=>x!==sk):[...sel,sk]; sv("skill",cur.join(",")); }} style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", borderRadius: 10, border: `1.5px solid ${checked?"#7C3AED":"#E2E8F0"}`, background: checked ? "#F5F3FF" : "#F8FAFC", cursor: "pointer", transition: "all 0.15s" }}>
                              <div style={{ width: 17, height: 17, borderRadius: 5, border: `2px solid ${checked?"#7C3AED":"#D1D5DB"}`, background: checked?"#7C3AED":"transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{checked && <span style={{ color: "#fff", fontSize: 10, fontWeight: 700 }}>✓</span>}</div>
                              <span style={{ fontSize: 12, fontWeight: 600, color: checked?"#7C3AED":"#64748B" }}>{SVC_ICO[sk]} {sk}</span>
                            </label>;
                          })}
                        </div>
                      </div>
                      <div><label style={LBL}>Experience</label><input value={f.exp} onChange={e => sv("exp", e.target.value)} placeholder="e.g. 3 years" style={IS} onFocus={e => e.target.style.borderColor="#7C3AED"} onBlur={e => e.target.style.borderColor="#E2E8F0"} /></div>
                    </>}
                    <div>
                      <label style={LBL}>Society</label>
                      <SocietySelect value={f.society} onChange={v => sv("society", v)} t={{ border: "#E2E8F0", inp: "#F8FAFC", txt: "#1A1F36", muted: "#64748B" }} />
                    </div>
                  </>}
                  <ErrRow msg={err} />
                  <button onClick={submit} disabled={load}
                    style={{ width: "100%", padding: "13px", borderRadius: 12, border: "none", background: "linear-gradient(135deg,#7C3AED,#8B5CF6)", color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer", boxShadow: "0 4px 16px rgba(124,58,237,0.35)", opacity: load ? 0.6 : 1, transition: "all 0.2s", marginTop: 2 }}>
                    {load ? "Please wait…" : mode === "login" ? "Sign In →" : "Create Account →"}
                  </button>
                </div>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════
       MAIN APP
    ══════════════════════════════════════ */
    function App() {
      const [showLanding, setShowLanding] = useState(true);
      const [user, setUser] = useState(null);
      const [dark, setDark] = useState(false);
      const [act, setAct] = useState("dash");
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [reqs, setReqs] = useState([]);
      const [notifs, setNotifs] = useState([]);
      const [loading, setLoading] = useState(true); // checking saved token on load
      // TRY MODE state
      const [tryMode, setTryMode] = useState(false);
      const [showLoginGate, setShowLoginGate] = useState(false);
      const [pendingAction, setPendingAction] = useState(null);

      const t = TH[dark ? "dark" : "light"];
      const unread = notifs.filter(n => !n.read_flag).length;

      // On first load — try to restore session from saved token
      useEffect(() => {
        (async () => {
          const token = localStorage.getItem("sc_token");
          if (token) {
            try {
              const u = await API.getMe();
              setUser(u); setShowLanding(false);
            } catch (e) {
              // Token expired or server down — clear token only if it's an auth error
              if (e.message && (e.message.includes("expired") || e.message.includes("Invalid token") || e.message.includes("missing"))) {
                localStorage.removeItem("sc_token");
              }
              // If server is just unreachable, keep token so user can retry
            }
          }
          setLoading(false);
        })();
      }, []);

      // Load user data whenever user logs in (once)
      const loadData = useCallback(async () => {
        if (!user) return;
        try {
          const [r, n] = await Promise.all([API.getRequests(), API.getNotifs()]);
          setReqs(r); setNotifs(n);
        } catch { }
      }, [user?.id]);

      // Only run loadData when user ID changes (login/logout), not on every render
      const prevUserIdRef = useRef(null);
      useEffect(() => {
        if (user && user.id !== prevUserIdRef.current) {
          prevUserIdRef.current = user.id;
          loadData();
        }
        if (!user) prevUserIdRef.current = null;
      }, [user?.id]);

      const handleLogin = (u) => {
        broadcastLogin();
        setUser(u); setAct("dash"); setShowLanding(false); setTryMode(false); setShowLoginGate(false);
      };
      // Called when user clicks something that requires login (try mode)
      const requireLogin = (actionName) => {
        setPendingAction(actionName);
        setShowLoginGate(true);
      };
      const handleLogout = () => {
        localStorage.removeItem("sc_token");
        setUser(null); setReqs([]); setNotifs([]); setAct("dash"); setShowLanding(true);
      };

      if (loading) return null; // Loader overlay handles this visually
      if (!user && showLanding) return <LandingPage onGetStarted={() => { setShowLanding(false); setTryMode(true); }} />;
      if (!user && !tryMode) return <Auth onLogin={handleLogin} onBack={() => setShowLanding(true)} />;

      // TRY MODE — show preview with login gate on actions
      if (!user && tryMode) {
        return <TryModeDashboard t={t} dark={dark} setDark={setDark} onRequireLogin={requireLogin} onGoSignIn={() => setShowLoginGate(true)}
          showLoginGate={showLoginGate} onCloseGate={() => setShowLoginGate(false)} onLogin={handleLogin} onBack={() => { setTryMode(false); setShowLanding(true); }} />;
      }

      return (
        <div style={{ display: "flex", height: "100vh", background: "#F4F6FA", fontFamily: "'DM Sans',sans-serif", overflow: "hidden" }}>
          <Sidebar user={user} act={act} setAct={setAct} t={t} open={sidebarOpen} onLogout={handleLogout} unread={unread} />
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0 }}>
            <TopBar act={act} t={t} dark={dark} setDark={setDark} setOpen={setSidebarOpen} unread={unread} setAct={setAct} reqs={reqs} />
            <div style={{ flex: 1, overflowY: "auto", padding: "22px 26px", background: "#F4F6FA" }} key={act} className="fade-in">
              {act === "dash" && <DashHome user={user} reqs={reqs} t={t} setAct={setAct} />}
              {act === "rules" && <RuleBook t={t} />}
              {act === "svc" && <ServiceReq user={user} t={t} onRequestCreated={r => setReqs(p => [r, ...p])} setNotifs={setNotifs} />}
              {act === "chat" && <ChatView t={t} user={user} reqs={reqs} />}
              {act === "hist" && <History t={t} reqs={reqs} onRefresh={loadData} user={user} setReqs={setReqs} />}
              {act === "notif" && <Notifs t={t} notifs={notifs} setNotifs={setNotifs} onRefresh={loadData} />}
              {act === "profile" && <Profile user={user} setUser={setUser} t={t} onLogout={handleLogout} />}
              {act === "support" && <Support user={user} t={t} />}
              {act === "admin" && user.role === "admin" && <AdminPanel t={t} />}
              {act === "prov" && user.role === "provider" && <ProviderPanel user={user} t={t} globalReqs={reqs} setGlobalReqs={setReqs} setNotifs={setNotifs} />}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>

  <script>
    /* PAGE LOADER */
    window.addEventListener("load", () => setTimeout(() => document.getElementById("loader").classList.add("hide"), 1200));

    /* SERVER STATUS — auto-ping, no manual toggle, just shows status */
    window.SC_ONLINE = false;
    localStorage.removeItem("sc_url");
    window.SERVER_URL = "https://societyconnect-knct.onrender.com";

    /* Cross-tab broadcast — prevent one tab's login from reloading others */
    try {
      const bc = new BroadcastChannel("sc_tab_sync");
      bc.onmessage = (e) => {
        if (e.data && e.data.type === "new_login") {
          // Another tab logged in — do NOT reload, just ignore
          console.log("[SocietyConnect] Another tab logged in, ignoring.");
        }
      };
      window._scBroadcast = bc;
    } catch { }

    function broadcastLogin() {
      try { if (window._scBroadcast) window._scBroadcast.postMessage({ type: "new_login", ts: Date.now() }); } catch { }
    }

    function updatePill(state) {
      const p = document.getElementById("srv-pill");
      const l = document.getElementById("srv-txt");
      if (!p || !l) return;
      p.className = "";
      if (state === "online") { p.classList.add("online"); l.textContent = "● server"; }
      else if (state === "offline") { p.classList.add("offline"); l.textContent = "● offline"; }
      else { p.classList.add("local"); l.textContent = "● local"; }
    }

    let _pingActive = false;
    async function pingServer() {
      if (_pingActive) return; _pingActive = true;
      try {
        const r = await fetch(window.SERVER_URL + "/api/ping", { signal: AbortSignal.timeout(3000) });
        if (r.ok) { window.SC_ONLINE = true; updatePill("online"); }
        else { window.SC_ONLINE = false; updatePill("offline"); }
      } catch { window.SC_ONLINE = false; updatePill("offline"); }
      _pingActive = false;
    }

    // Ping immediately then every 30 seconds (was 10s — reduced to avoid triggering re-renders)
    pingServer();
    setInterval(pingServer, 30000);
  </script>
</body>

</html>
